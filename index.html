/* labels: the app's interface stays in English; in the German course the words "Portuguese" and "English" swap roles */
const LRX=/Aprende Português|English meaning|German meaning \(optional, shown under \?\)|Auf Deutsch|\? Deutsch|German explanation|Português|Portuguese|English/g;
const LRT=new RegExp(LRX.source);
const LMAP={'English meaning':'Portuguese meaning','German meaning (optional, shown under ?)':'English meaning (optional)','Aprende Português':'Aprende Alemão','Auf Deutsch':'Em português','? Deutsch':'? Português','German explanation':'Explicação','Português':'Deutsch','Portuguese':'German','English':'Português'};
const LDONE=new WeakSet();
function locNode(root){
 if(COURSE()!=='de'||!root)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);let n;
 const fix=s=>s.replace(LRX,m=>LMAP[m]);
 while((n=w.nextNode())){if(LDONE.has(n))continue;LDONE.add(n);const p=n.parentElement;if(!p||p.closest('script,style,textarea,.bub,.wrow b,.noloc'))continue;const v=n.nodeValue;if(LRT.test(v))n.nodeValue=fix(v);}
 if(root.querySelectorAll)root.querySelectorAll('[placeholder],[aria-label]').forEach(e=>{['placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v&&LRT.test(v))e.setAttribute(a,fix(v));});});
}
try{new MutationObserver(ms=>{if(COURSE()!=='de')return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===3)locNode(n.parentElement);else if(n.nodeType===1)locNode(n);}));}).observe(document.body,{childList:true,subtree:true});}catch(e){}

/* ---------- spaced repetition + review mini games inside sessions ----------
   Intervals (days) per box: 0, 1, 2, 4, 7, 14, 30, 60, 120. A new word you know comes back tomorrow,
   then after 2, 4, 7 ... days. A miss sends it back to tomorrow. Answers in games count as reviews too. */
function srsMark(id,ok){
 const c=S.cards[id];if(!c||!c.seen)return;wkInc('review',1);const t=today();
 if(ok){if(c.due<=t){c.b=Math.min(8,c.b+1);c.due=t+INT[c.b];}c.ok++;}
 else{c.b=Math.max(0,c.b-2);c.due=t+1;}
 c.seen++;save();
}
/* after every 3 cards, a quick quiz on exactly those words; a pairs round at the end */
function withQuizzes(items){
 const out=[],done=[];let chunk=[];
 const kinds=w=>{const k=['mc','listen'];if(w.pt.length<=16)k.push('type');return k;};
 const flush=()=>{shuf(chunk).forEach(id=>{const w=WORDS[id];if(!w)return;const ks=kinds(w);out.push({quiz:ks[Math.floor(Math.random()*ks.length)],id});});chunk=[];};
 items.forEach(it=>{out.push(it);if(!chunk.includes(it.id)){chunk.push(it.id);done.push(it.id);}if(chunk.length>=3)flush();});
 if(chunk.length)flush();
 const u=[...new Set(done)].filter(id=>WORDS[id]);if(u.length>=4)out.push({quiz:'pairs',ids:shuf(u).slice(0,5)});
 return out;
}

   speech recognition. What you said is compared with the target and scored. */
let DICT=null;
if(window.claude&&window.claude.use){try{claude.use('dictation').then(d=>{DICT=d;if(d){d.onFinal(({text})=>{if(MIC.on)MIC.text=(MIC.text+' '+text).trim();micShow();});d.onPartial(({text})=>{if(MIC.on){MIC.part=text;micShow();}});d.onState(({state})=>{if(state==='idle'&&MIC.on)micDone();});}render();},()=>{});}catch(e){}}

const simil=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length);};

 else if(SR){try{const r=new SR();r.lang=lang;r.interimResults=true;r.maxAlternatives=3;MIC.rec=r;
  r.onresult=e=>{let fin='',part='';for(let i=0;i<e.results.length;i++){const x=e.results[i];if(x.isFinal)fin+=x[0].transcript+' ';else part+=x[0].transcript;}MIC.text=fin.trim();MIC.part=part;micShow();};
  r.onerror=()=>{};r.onend=()=>{if(MIC.on)micDone();};r.start();}catch(e){MIC.on=false;toast('Speech recognition is not available here.');}}

/* ---------- weekly challenges: three new ones every Monday ---------- */
const WKPOOL=[
 {k:'new',n:[20,30,40],t:n=>'Learn '+n+' new words'},
 {k:'review',n:[40,60,80],t:n=>'Answer '+n+' review questions'},
 {k:'talk',n:[3,5,7],t:n=>'Finish '+n+' conversations'},
 {k:'games',n:[6,10,14],t:n=>'Play '+n+' games'},
 {k:'xp',n:[300,500,800],t:n=>'Earn '+n+' XP'},
 {k:'days',n:[3,4,5],t:n=>'Practise on '+n+' different days'},
 {k:'speak',n:[10,20,30],t:n=>'Say '+n+' words or sentences out loud'},
 {k:'mine',n:[5,10,15],t:n=>'Add '+n+' words to My words'}
];
const weekKey=()=>Math.floor((today()+3)/7); /* weeks start on Monday */
function wkRand(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280;};}
function wkEnsure(){
 const k=weekKey();if(S.wk&&S.wk.k===k)return S.wk;
 const r=wkRand(k+(S.cn||0)),pool=WKPOOL.filter(c=>c.k!=='speak'||micOK()),pick=[];
 while(pick.length<3){const c=pool[Math.floor(r()*pool.length)];if(!pick.includes(c))pick.push(c);}
 const lv=Math.min(2,Math.floor((lvlOf(S.xp)-1)/6));
 S.wk={k,list:pick.map(c=>({k:c.k,goal:c.n[lv],prog:0,claimed:false})),days:[],bonus:false};
 return S.wk;
}
function wkInc(kind,n){
 try{const w=wkEnsure();let ch=false;
  if(kind==='xp'){const t=today();if(!w.days.includes(t)){w.days.push(t);w.list.forEach(c=>{if(c.k==='days'){c.prog=w.days.length;ch=true;}});}}
  w.list.forEach(c=>{if(c.k===kind&&c.prog<c.goal){const was=c.prog<c.goal;c.prog=Math.min(c.goal,c.prog+n);ch=true;if(was&&c.prog>=c.goal){setTimeout(()=>{sfx('combo');toast('Weekly challenge done! Claim your reward.');},300);}}});
 }catch(e){}
}
function wkClaim(i){
 const w=wkEnsure(),c=w.list[i];if(!c||c.claimed||c.prog<c.goal)return;c.claimed=true;addXP(100);sfx('win');floatXP(100,lastTapEl);
 if(w.list.every(x=>x.claimed)&&!w.bonus){w.bonus=true;S.wkDone=(S.wkDone||0)+1;addXP(150);setTimeout(()=>{confetti();toast('All weekly challenges done! +150 bonus XP');},400);}
 save();render();
}

/* ---------- Learning duel: live, through the claude.ai room ----------
   Both players join the same code. Each answers 10 questions in their OWN course (you Portuguese, a friend German),
   and both see each other's score live. Presence carries each player's state; nothing is stored. */
const duelOK=()=>!!(window.claude&&window.claude.use);
function startDuel(){stopGame();ui.g={k:'duel',st:'lobby',code:'',room:null,peers:[],err:'',me:{ready:false,score:0,qi:0,done:false,start:0},qs:[],t:60,startAt:0};window.scrollTo(0,0);render();}
async function duelJoin(code){
 const g=ui.g;code=String(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);if(code.length<3){toast('Enter the duel code');return;}
 g.code=code;g.err='';g.st='joining';render();
 let room=null;try{room=await claude.use('room');}catch(e){}
 if(ui.g!==g)return;
 if(!room){g.st='lobby';g.err='Live duels are not available in this view. Both players must open the app through its claude.ai link while signed in, and your friend must be invited to it.';render();return;}
 try{g.room=await room.join('duel-'+code);}catch(e){g.st='lobby';g.err=e&&e.code==='not_permitted'?'You cannot join live rooms here. Your friend must be invited to the app (Share menu) and signed in.':'Could not join the duel. Try again.';render();return;}
 if(ui.g!==g){try{g.room.leave();}catch(e){}return;}
 const p=me()||{name:'Player',av:'🦊'};
 g.room.presence({v:1,name:String(p.name).slice(0,20),av:p.av,course:COURSE(),ready:false,score:0,qi:0,done:false,start:0});
 g.unsub=g.room.onPeers(ch=>{if(ui.g!==g)return;g.peers=ch.peers.filter(x=>x.kind==='viewer'&&x.presence&&x.presence.v===1);duelTick();});
 g.st='wait';render();
}
const dp=x=>x.presence||{};
function duelTick(){
 const g=ui.g;if(!g||g.k!=='duel')return;
 const others=g.peers.filter(x=>!(x.isMe&&x.sameTab));
 if((g.st==='wait')&&g.me.ready&&others.length&&others.every(x=>dp(x).ready)){
  /* the player with the smallest peer label starts the countdown */
  const host=g.peers.slice().sort((a,b)=>a.peer<b.peer?-1:1)[0];
  if(host&&host.isMe&&host.sameTab&&!g.me.start){g.me.start=Date.now();g.room.presence({start:g.me.start});}
  if(host&&(dp(host).start||g.me.start))duelCount();
 }
 if(g.st==='end'||g.st==='play'||g.st==='wait')render();
}
function duelCount(){
 const g=ui.g;if(g.st!=='wait')return;g.st='count';g.cd=3;render();sfx('tap');
 const iv=setInterval(()=>{if(ui.g!==g){clearInterval(iv);return;}g.cd--;if(g.cd<=0){clearInterval(iv);duelPlay();}else{sfx('tap');render();}},1000);
}
function duelPlay(){
 const g=ui.g,P=pool();const types=['en2pt','pt2en','en2pt','pt2en','listen2en'];
 g.qs=shuf(P).slice(0,10).map((w,i)=>mkQ(w,types[i%types.length]));g.me.qi=0;g.me.score=0;g.me.done=false;g.st='play';g.t=60;g.sel=null;g.qt=Date.now();
 g.room.presence({score:0,qi:0,done:false});
 g.iv=setInterval(()=>{if(ui.g!==g||g.st!=='play')return;g.t--;const e=$('#dut');if(e)e.textContent=g.t+'s';if(g.t<=0)duelFinish();},1000);
 duelSpeak();render();
}
function duelSpeak(){const g=ui.g,q=g.qs[g.me.qi];if(q&&q.type==='listen2en')ui.pend=q.w.pt;}
function duelPick(i){
 const g=ui.g;if(g.st!=='play'||g.sel!=null)return;const q=g.qs[g.me.qi];g.sel=i;
 if(q.o[i].ok){const fast=Math.max(0,5-Math.floor((Date.now()-g.qt)/1000));g.me.score+=10+fast;cheer(0);srsMark(q.w.id,true);}else{boo();srsMark(q.w.id,false);}
 g.room.presence({score:g.me.score,qi:g.me.qi+1});render();
 setTimeout(()=>{if(ui.g!==g||g.st!=='play')return;g.me.qi++;g.sel=null;g.qt=Date.now();if(g.me.qi>=g.qs.length)duelFinish();else{duelSpeak();render();}},650);
}
function duelFinish(){const g=ui.g;if(g.st==='end')return;clearInterval(g.iv);g.st='end';g.me.done=true;g.room.presence({done:true,score:g.me.score});addXP(Math.round(g.me.score/4));wkInc('games',1);render();}
function duelBoard(){
 const g=ui.g;const rows=g.peers.slice().sort((a,b)=>(dp(b).score||0)-(dp(a).score||0));
 return '<div class="duelboard noloc">'+rows.map(x=>{const p=dp(x),mine=x.isMe&&x.sameTab,sc=mine?g.me.score:(p.score||0),qi=mine?g.me.qi:(p.qi||0);
  return '<div class="duelrow'+(mine?' me':'')+'"><span class="dav">'+esc(p.av||'🙂')+'</span><div class="grow"><div class="row" style="justify-content:space-between"><b>'+esc(p.name||'Player')+(mine?' (you)':'')+'</b><span class="mut sm">'+(p.course==='de'?'learns German':'learns Portuguese')+'</span></div><div class="pbar" style="height:10px;margin-top:4px"><i style="width:'+Math.min(100,qi*10)+'%"></i></div></div><b class="dsc">'+sc+'</b>'+(g.st==='wait'?(p.ready||(mine&&g.me.ready)?'<span class="chip blue">Ready</span>':'<span class="chip">Waiting</span>'):'')+'</div>';}).join('')+'</div>';
}

  return '<div class="stack">'+gHead('Learning duel')+'<div class="pcard" style="gap:10px;text-align:left;align-items:stretch"><b class="gt">Play live against a friend</b><p class="sm">You both answer 10 questions in your own course: you in Portuguese, a Portuguese friend in German. Fast answers score more.</p>'

  return '<div class="stack">'+gHead('Learning duel')+'<div class="pcard"><div class="lab">Duel code</div><div class="word" style="letter-spacing:.15em">'+esc(g.code)+'</div><p class="mut sm">Send this code to your friend. They tap Join and type it in.</p></div>'
  +duelBoard()+(n<2?'<p class="mut sm" style="text-align:center">Waiting for your friend…</p>':'')
  +'<button class="btn xl block '+(g.me.ready?'ghost':'sun')+'" data-act="duelready">'+(g.me.ready?'Not ready':'I am ready')+'</button></div>';}
 if(g.st==='count')return '<div class="stack">'+gHead('Learning duel')+'<div class="pcard" style="padding:40px"><div class="lab">Get ready</div><div class="lvnum pop-in">'+g.cd+'</div></div>'+duelBoard()+'</div>';
 if(g.st==='play'){const q=g.qs[g.me.qi],rev=g.sel!=null;if(!q)return '';
  return '<div class="stack">'+gHud({p:g.me.qi/g.qs.length,chips:'<span class="hc time">'+ic('time',20)+'<span id="dut">'+g.t+'s</span></span>'})+duelBoard()
  +'<div class="pcard pop-in">'+qPrompt(q)+'</div><div class="stack" style="gap:8px">'+q.o.map((o,i)=>{const c=rev?(o.ok?' ok':(g.sel===i?' bad':' dim')):'';return '<button class="opt'+c+'" data-act="duelpick" data-i="'+i+'" '+(rev?'disabled':'')+'><span class="grow">'+esc(o.t)+'</span></button>';}).join('')+'</div></div>';}
 const all=g.peers.every(x=>(x.isMe&&x.sameTab)||dp(x).done),rows=g.peers.slice().sort((a,b)=>((b.isMe&&b.sameTab?g.me.score:dp(b).score)||0)-((a.isMe&&a.sameTab?g.me.score:dp(a).score)||0)),win=rows[0]&&rows[0].isMe&&rows[0].sameTab;
 if(all&&!g.cel){g.cel=1;celebrate(win);}
 return '<div class="stack">'+gHead('Learning duel')+'<div class="res'+(all&&!win?' lose':'')+'"><div class="trophy">'+ic(all&&win?'trophy':'flag',48)+'</div><h1>'+(all?(win?'You won!':'Good game!'):'Waiting for the others…')+'</h1><p class="mut">Your score: '+g.me.score+'</p></div>'+duelBoard()
 +'<button class="btn xl block" data-act="duelagain">Play again</button><button class="btn ghost block" data-act="gexit">Leave duel</button></div>';
}

/* ---------- tap a word: meaning, conjugation and a short explanation ----------
   European Portuguese conjugation for regular -ar/-er/-ir verbs, spelling changes and the most common irregular verbs.
   Tenses: presente, pretérito perfeito, pretérito imperfeito, futuro. Persons: eu, tu, ele/ela/você, nós, eles/elas/vocês. */
const PERS=['eu','tu','ele / ela / você','nós','eles / elas / vocês'];
const TENS=[['pres','Presente','Präsens'],['perf','Pretérito perfeito','Perfekt / abgeschlossene Vergangenheit'],['imp','Pretérito imperfeito','Imperfekt / Gewohnheit in der Vergangenheit'],['fut','Futuro','Futur']];
const IRR={
 ser:{pres:'sou és é somos são',perf:'fui foste foi fomos foram',imp:'era eras era éramos eram',pp:'sido'},
 estar:{pres:'estou estás está estamos estão',perf:'estive estiveste esteve estivemos estiveram',pp:'estado'},
 ter:{pres:'tenho tens tem temos têm',perf:'tive tiveste teve tivemos tiveram',imp:'tinha tinhas tinha tínhamos tinham',pp:'tido'},
 ir:{pres:'vou vais vai vamos vão',perf:'fui foste foi fomos foram',imp:'ia ias ia íamos iam',pp:'ido'},
 fazer:{pres:'faço fazes faz fazemos fazem',perf:'fiz fizeste fez fizemos fizeram',fut:'farei farás fará faremos farão',pp:'feito'},
 poder:{pres:'posso podes pode podemos podem',perf:'pude pudeste pôde pudemos puderam'},
 querer:{pres:'quero queres quer queremos querem',perf:'quis quiseste quis quisemos quiseram'},
 saber:{pres:'sei sabes sabe sabemos sabem',perf:'soube soubeste soube soubemos souberam'},
 dizer:{pres:'digo dizes diz dizemos dizem',perf:'disse disseste disse dissemos disseram',fut:'direi dirás dirá diremos dirão',pp:'dito'},
 vir:{pres:'venho vens vem vimos vêm',perf:'vim vieste veio viemos vieram',imp:'vinha vinhas vinha vínhamos vinham',pp:'vindo'},
 ver:{pres:'vejo vês vê vemos veem',perf:'vi viste viu vimos viram',pp:'visto'},
 dar:{pres:'dou dás dá damos dão',perf:'dei deste deu demos deram'},
 'pôr':{pres:'ponho pões põe pomos põem',perf:'pus puseste pôs pusemos puseram',imp:'punha punhas punha púnhamos punham',fut:'porei porás porá poremos porão',pp:'posto'},
 haver:{pres:'hei hás há havemos hão',perf:'houve houveste houve houvemos houveram'},
 trazer:{pres:'trago trazes traz trazemos trazem',perf:'trouxe trouxeste trouxe trouxemos trouxeram',fut:'trarei trarás trará traremos trarão'},
 ler:{pres:'leio lês lê lemos leem',perf:'li leste leu lemos leram'},
 sair:{pres:'saio sais sai saímos saem',perf:'saí saíste saiu saímos saíram',imp:'saía saías saía saíamos saíam'},
 cair:{pres:'caio cais cai caímos caem',perf:'caí caíste caiu caímos caíram',imp:'caía caías caía caíamos caíam'},
 rir:{pres:'rio ris ri rimos riem'},
 ouvir:{pres:'ouço ouves ouve ouvimos ouvem'},pedir:{pres:'peço pedes pede pedimos pedem'},medir:{pres:'meço medes mede medimos medem'},
 perder:{pres:'perco perdes perde perdemos perdem'},valer:{pres:'valho vales vale valemos valem'},
 dormir:{pres:'durmo dormes dorme dormimos dormem'},subir:{pres:'subo sobes sobe subimos sobem'},fugir:{pres:'fujo foges foge fugimos fogem'},
 abrir:{pp:'aberto'},escrever:{pp:'escrito'},ganhar:{pp:'ganho'},pagar:{pp:'pago'},gastar:{pp:'gasto'}
};
/* -ir verbs whose stem e becomes i in the eu form (sentir: sinto) */
const E2I=['sentir','preferir','vestir','servir','seguir','conseguir','repetir','divertir','mentir','sugerir','referir','competir'];
const VERBS={};
function conj(inf){
 if(VERBS[inf])return VERBS[inf];
 const refl=/-se$/.test(inf),v=inf.replace(/-se$/,''),irr=IRR[v]||{};
 const end=v.slice(-2),st=v.slice(0,-2);
 const T={};
 if(end==='ar'){
  const pe=v.endsWith('car')?st.slice(0,-1)+'qu':v.endsWith('gar')?st+'u':v.endsWith('çar')?st.slice(0,-1)+'c':st;
  T.pres=[st+'o',st+'as',st+'a',st+'amos',st+'am'];T.perf=[pe+'ei',st+'aste',st+'ou',st+'ámos',st+'aram'];T.imp=[st+'ava',st+'avas',st+'ava',st+'ávamos',st+'avam'];T.pp=st+'ado';
 }else if(end==='er'||end==='ir'||v==='pôr'){
  const e=end==='ir'?'i':'e';
  let s1=st+'o';
  if(v.endsWith('cer'))s1=st.slice(0,-1)+'ço';else if(/g[ei]r$/.test(v))s1=st.slice(0,-1)+'jo';else if(v.endsWith('guir'))s1=st.slice(0,-1)+'o';
  if(E2I.includes(v)){const i=st.lastIndexOf('e');s1=(st.slice(0,i)+'i'+st.slice(i+1));s1=(v.endsWith('guir')?s1.slice(0,-1):s1)+'o';}
  T.pres=[s1,st+'es',st+'e',st+(e==='i'?'imos':'emos'),st+'em'];
  T.perf=[st+'i',st+(e==='i'?'iste':'este'),st+(e==='i'?'iu':'eu'),st+(e==='i'?'imos':'emos'),st+(e==='i'?'iram':'eram')];
  T.imp=[st+'ia',st+'ias',st+'ia',st+'íamos',st+'iam'];T.pp=st+(e==='i'?'ido':'ido');
 }else return null;
 T.fut=['ei','ás','á','emos','ão'].map(x=>v+x);
 ['pres','perf','imp','fut'].forEach(k=>{if(irr[k])T[k]=irr[k].split(' ');});if(irr.pp)T.pp=irr.pp;
 if(refl){const pr=['-me','-te','-se','-nos','-se'];['pres','perf','imp'].forEach(k=>{T[k]=T[k].map((f,i)=>(i===3?f.replace(/s$/,''):f)+pr[i]);});
  /* European Portuguese future with the pronoun in the middle: lembrar-me-ei */
  const fb=irr.fut?irr.fut.split(' ')[0].replace(/ei$/,''):v;T.fut=['ei','ás','á','emos','ão'].map((x,i)=>fb+pr[i]+'-'+x);}
 T.inf=inf;T.ger=v.replace(/r$/,'ndo').replace('pôndo','pondo');
 return VERBS[inf]=T;
}
/* index: every form -> [{inf, tense, person}] */
let FORMS=null;
function buildForms(){
 FORMS={};const infs=new Set(Object.keys(IRR));
 TOPICS.forEach(t=>t.w.forEach(s=>{const p=s.split('|');if(/^to /.test(p[1])&&/^[a-zçãõáéíóúâêô]+(ar|er|ir)(-se)?$/.test(p[0]))infs.add(p[0]);}));
 ['falar','comer','viver','morar','gostar','trabalhar','chamar-se','levantar-se','lembrar-se','esquecer-se','sentar-se','deitar-se','tomar','ficar','chegar','começar','pensar','conhecer','parecer','acontecer','preferir','sentir','seguir','conseguir','vestir-se','vestir','abrir','escrever','pagar','ganhar','gastar','precisar','entrar','estudar','comprar','beber','dormir','ouvir','pedir','perder','subir','sair','ler','rir','cair','trazer','dar','pôr'].forEach(v=>infs.add(v));
 infs.forEach(inf=>{const T=conj(inf);if(!T)return;const add=(f,tn,pi)=>{f=f.toLowerCase();(FORMS[f]=FORMS[f]||[]).push({inf,tn,pi});};
  ['pres','perf','imp','fut'].forEach(k=>T[k].forEach((f,i)=>{add(f,k,i);if(/-/.test(f))add(f.split('-')[0],k,i);}));
  add(inf.replace(/-se$/,''),'inf',-1);add(T.pp,'pp',-1);add(T.ger,'ger',-1);});
}
const clean=w=>String(w).toLowerCase().replace(/^[«"“'(¿¡]+|[»"”'),.!?;:…]+$/g,'');
/* make every word of a Portuguese text tappable */
function tw(text){
 if(COURSE()!=='pt'&&COURSE()!=='de')return esc(text);
 return String(text).split(/(\s+)/).map(tok=>/^\s+$/.test(tok)||!tok?tok:'<span class="tw" data-act="word" data-w="'+esc(tok)+'">'+esc(tok)+'</span>').join('');
}
function findWord(c){const ws=Object.values(WORDS);return ws.find(w=>clean(w.pt)===c)||ws.find(w=>clean(w.pt).replace(/^(o|a|os|as) /,'')===c)||null;}
function wordInfo(raw,ctx){
 if(!FORMS)buildForms();
 const c=clean(raw),parts=c.split('-'),base=parts[0];
 let hits=COURSE()==='pt'?(FORMS[c]||FORMS[base]||[]).slice():[];
 /* a pronoun right before the verb (como te chamas) points to the reflexive verb */
 if(hits.length>1&&new RegExp('(^|\\s)(me|te|se|nos)\\s+'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(\\s|$|[?!.,])','i').test(clean(ctx||'')+' '+String(ctx||'').toLowerCase()))hits.sort((x,y)=>(/-se$/.test(y.inf)?1:0)-(/-se$/.test(x.inf)?1:0));
 const dict=findWord(c)||findWord(base);
 let h='<div class="winfo"><div class="row"><b class="gt grow" style="font-size:1.4rem">'+esc(c)+'</b>'+spk(c)+'</div>';
 if(dict)h+='<p><b>'+esc(dict.en)+'</b>'+(dict.de?' · '+esc(dict.de):'')+'</p>';

/* obstacle shapes per world */
function qObsShape(W,o){
 if(W.obs==='board'){o.w=16;o.h=46+Math.round(Math.random()*8);}
 else if(W.obs==='cone'){o.w=26;o.h=32+Math.round(Math.random()*6);}
 else if(W.obs==='buoy'){o.w=30;o.h=30;}
 else if(W.obs==='rock'){o.w=36+Math.round(Math.random()*8);o.h=26+Math.round(Math.random()*10);}
 else if(W.obs==='cone2'){o.w=24;o.h=30;}
}
function qObsDraw(c,g,o,x,y){
 const k=g.w.obs;if(!k||k==='crate')return false;
 c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(x+o.w/2,GY+2,o.w/2+3,4,0,0,7);c.fill();
 if(k==='board'){const cols=['#FF6B5A','#2EA8FF','#FFD34D','#22C08A'],col=cols[Math.abs(Math.round(o.x))%4];c.fillStyle=col;c.beginPath();c.ellipse(x+o.w/2,y+o.h/2,o.w/2,o.h/2,0,0,7);c.fill();c.fillStyle='#fff';c.fillRect(x+o.w/2-1.5,y+5,3,o.h-10);}
 else if(k==='cone'){c.fillStyle='#F57C1F';c.beginPath();c.moveTo(x+o.w/2,y);c.lineTo(x+o.w,GY-4);c.lineTo(x,GY-4);c.closePath();c.fill();c.fillStyle='#fff';c.fillRect(x+o.w*.3,y+o.h*.45,o.w*.4,5);c.fillStyle='#E06A10';c.fillRect(x-3,GY-5,o.w+6,5);}
 else if(k==='buoy'){c.fillStyle='#E54B3C';c.beginPath();c.arc(x+15,y+15,15,0,7);c.fill();c.fillStyle='#fff';c.fillRect(x+1,y+12,28,6);c.strokeStyle='#5A4636';c.lineWidth=2;c.beginPath();c.moveTo(x+15,y);c.lineTo(x+15,y-8);c.stroke();}

}
/* seagulls fly at jump height: stay on the ground when one comes */
function qMakeGulls(obs,gates,finish){
 /* every third ground obstacle (after the start) becomes a seagull, so there is room around it */
 const out=[];for(let k=obs.length-1;k>=0;k--){const o=obs[k];if(o.x<800||k%3)continue;if(gates.some(g=>Math.abs(g.x-o.x)<300))continue;out.push({x:o.x+o.w/2,y:162+Math.random()*16,ph:Math.random()*6});obs.splice(k,1);}return out;
}

function qGullHit(g,pr){
 if(!g.gulls||g.inv>0)return;
 g.gulls.forEach(b=>{if(b.hit)return;const bx=b.x-g.cam;if(hit(pr,{x:bx-16,y:b.y-8,w:32,h:16})){b.hit=true;g.hearts--;g.inv=1.3;sfx('hit');buzz(60);burst(g,bx,b.y,'#FFFFFF',14);if(g.hearts<=0)qEnd('over');}});
}

/* ---------- installed web app (GitHub Pages): offline download of all recordings ---------- */
const isWebApp=()=>!(window.claude&&window.claude.use)&&location.protocol==='https:'&&'serviceWorker' in navigator;
async function offlineAll(){
 if(!(typeof APACK!=='undefined'&&APACK)){toast('Nothing to download');return;}
 const files=APACK.files;let n=0;const el=$('#offst');
 for(const f of files){try{const r=await fetch(f);if(r.ok){await r.arrayBuffer();n++;}}catch(e){}if(el)el.textContent='Downloading recordings… '+n+' of '+files.length;}
 S.offline=n===files.length;save();if(el)el.textContent=S.offline?'All recordings are on this device. The app works without internet.':'Some files could not be downloaded. Try again with a good connection.';toast(S.offline?'Ready for offline use':'Download incomplete');
}

 case 'plav2':{const p=me();if(!p)break;if(!avUnlocked(D.v)){toast('Unlocks at a higher level');break;}p.av=D.v;plSave();profileSheet();render();break;}
 case 'mem':memFlip(+D.i);break;
 case 'swy':swDecide(true);break;
 case 'swn':swDecide(false);break;
 case 'sch':{const g=ui.g;if(g.res==null&&!g.ans.includes(+D.id)){g.ans.push(+D.id);sfx('tap');const c=g.chips.find(c=>c.id===+D.id);if(c)say(c.t);render();}break;}
 case 'sun':{const g=ui.g;if(g.res==null){g.ans=g.ans.filter(x=>x!==+D.id);render();}break;}
 case 'scheck':sCheck();break;
 case 'snext':{const g=ui.g;g.i++;if(g.i>=g.n){g.st='end';g.stars=starsBy(g.sc/g.n);S.best.sent=Math.max(S.best.sent||0,g.sc);save();render();celebrate(g.sc/g.n>=.5);}else{sInit();render();}break;}
 case 'profile':ui.delP=false;profileSheet();break;
 case 'logout':plLogout();break;
 case 'plmode':ui.lg=Object.assign(ui.lg||{},{mode:D.v,pin:'',bad:false});render();break;
 case 'plav':ui.lg.av=D.v;{const n=$('#pl-name'),pn=$('#pl-pin'),nv=n?n.value:'',pv=pn?pn.value:'';render();const n2=$('#pl-name'),p2=$('#pl-pin');if(n2)n2.value=nv;if(p2)p2.value=pv;}break;
 case 'plcreate':plCreate();break;
 case 'plpick':{const p=PL.list.find(x=>x.id===D.id);if(!p)break;if(p.pin){ui.lg={mode:'pin',id:p.id,pin:''};render();}else plLogin(p.id);break;}
 case 'pinkey':pinKey(D.v);break;
 case 'dlsave':dlSave();break;
 case 'ldsave':ldSave();break;
 case 'pldel1':ui.delP=true;profileSheet();break;
 case 'pldel0':ui.delP=false;profileSheet();break;
 case 'pldel2':plDelete();break;
 case 'bkcopy':{const txt=JSON.stringify(S);const ta=$('#bk');if(ta){ta.value=txt;}try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>{if(ta){ta.select();}toast('Select and copy the text');});}catch(e){if(ta)ta.select();toast('Select and copy the text');}break;}
 case 'bkrestore':{const ta=$('#bk');try{const o=JSON.parse(ta.value);if(!o||typeof o!=='object'||!o.cards)throw 0;S=Object.assign(defs(),o);syncCustom();save();ui.sheet=null;render();toast('Backup restored');}catch(e){toast('That is not a valid backup');}break;}
 case 'reset1':ui.confirmReset=true;renderSheet();break;
 case 'reset0':ui.confirmReset=false;renderSheet();break;
 case 'reset2':S=defs();syncCustom();save();ui.confirmReset=false;ui.sheet=null;ui.ob=0;stopGame();ui.screen='home';ui.sess=ui.d=ui.g=ui.c=null;render();break;
 case 'session':startSession(shuf(dueIds()).slice(0,25).concat(newIds()),'Review');break;
 case 'study':startSession(shuf(TB[D.id].words.map(w=>w.id)),TB[D.id].n);break;
 case 'flip':{ui.sess.flip=true;const it=ui.sess.q[0];if((S.auto&&it.dir==='en')||isMine(it.id))ui.pend=WORDS[it.id].pt;render();break;}
 case 'rate':rate(+D.r);break;
 case 'sessend':{const hn=ui.sess&&ui.sess.node;if(hn)toJourney();else{ui.sess=null;render();window.scrollTo(0,0);}break;}
 case 'lt':ui.lt=D.v;render();break;
 case 'topic':ui.screen='learn';ui.topic=D.id;window.scrollTo(0,0);render();break;
 case 'tback':ui.topic=null;render();break;
 case 'unlock':if(!S.unlocked.includes(D.id))S.unlocked.push(D.id);save();render();break;
 case 'addhome':ui.screen='learn';ui.lt='mine';ui.topic=null;render();break;
 case 'addw':{const pt=$('#a-pt').value.trim(),en=$('#a-en').value.trim(),de=$('#a-de').value.trim();if(!pt||!en){toast('Add the Portuguese word and its English meaning');break;}S.custom.unshift({id:'my'+(++S.cn),pt,en,de});wkInc('mine',1);syncCustom();save();toast('Added. Listen!');render();say(pt,false,true);break;}
 case 'delw':S.custom=S.custom.filter(c=>c.id!==D.id);delete S.cards[D.id];syncCustom();save();render();break;
 case 'dstart':dStart(D.id);break;
 case 'dexit':{const hn=ui.d&&ui.d.node;if(hn)toJourney();else{ui.d=null;ui.screen='talk';render();window.scrollTo(0,0);}break;}
 case 'dpick':dPick(+D.i);break;
 case 'dtr':ui.d.show[D.k]=!ui.d.show[D.k];render();break;
 case 'dde':{const m=ui.d.log[+D.k];ui.sheet={title:'Auf Deutsch',html:'<p class="de">'+esc(m.de)+'</p><p class="mut sm">'+esc(m.pt)+'<br>'+esc(m.en)+'</p>'};renderSheet();break;}
 case 'gexit':{const hn=ui.g&&ui.g.node;if(hn)toJourney();else{stopGame();ui.g=null;ui.screen='play';render();window.scrollTo(0,0);}break;}
 case 'gmill':stopGame();startMill();break;
 case 'gbuild':stopGame();startBuild();break;
 case 'glisten':stopGame();startListen();break;
 case 'gmatch0':stopGame();startMatch(false);break;
 case 'gmatch1':stopGame();startMatch(true);break;
 case 'gquest':stopGame();startQuest();break;
 case 'pick':{const i=+D.i;if(ui.g&&ui.g.k==='mill')millPick(i);else if(ui.g&&ui.g.k==='listen')listenPick(i);else if(ui.c)chkPick(i);break;}
 case 'm5050':{const g=ui.g,q=g.qs[g.q];if(g.used)break;g.used=true;g.rem=shuf(q.o.map((o,i)=>i).filter(i=>!q.o[i].ok)).slice(0,2);render();break;}
 case 'mwalk':ui.g.xp+=0;millEnd('walk');break;
 case 'mnext':{const g=ui.g;if(g.q>=14){millEnd('won');break;}g.q++;g.st='ask';g.sel=null;g.rem=[];g.used=g.used;millSpeak();render();break;}
 case 'mend':millEnd('over');break;
 case 'btile':{const g=ui.g;if(g.st==='right')break;const i=g.slots.indexOf(null);if(i<0)break;g.slots[i]=+D.id;g.st='play';bCheck();render();break;}
 case 'bslot':{const g=ui.g;if(g.st==='right')break;const i=+D.i;if(g.slots[i]!=null){g.slots[i]=null;g.st='play';render();}break;}
 case 'bclear':{const g=ui.g;g.slots=g.slots.map(()=>null);g.st='play';render();break;}
 case 'bhint':bHint();render();break;
 case 'bnext':{const g=ui.g;g.i++;if(g.i>=g.n){g.st='end';g.stars=g.sc/g.n>=.8?3:(g.sc/g.n>=.5?2:1);if(g.node)finishNode(g.node,g.stars);S.best.build=Math.max(S.best.build||0,g.sc);save();}else bInit();render();break;}
 case 'lnext':{const g=ui.g;g.i++;g.sel=null;g.st='ask';if(g.i>=g.n){g.st='end';g.stars=g.sc/g.n>=.8?3:(g.sc/g.n>=.5?2:1);if(g.node)finishNode(g.node,g.stars);S.best.listen=Math.max(S.best.listen||0,g.sc);save();}else ui.pend=g.qs[g.i].w.pt;render();break;}
 case 'ml':mTap('l',+D.i);break;
 case 'mr':mTap('r',+D.i);break;
 case 'qpick':qPick(+D.i);break;
 case 'qagain':{const g=ui.g;qNewQ();qPanel();break;}
 case 'chk':chkStart();break;
 case 'jnext':{const n=nextNode();if(!n){toJourney();toast('Journey complete!');break;}launch(n);break;}
 case 'jback':toJourney();break;
 case 'jretry':{const n=ui.g&&ui.g.node;if(n)launch(n);break;}
 case 'jtoggle':{const nx=nextNode(),cur=!!nx&&nx.unit===D.id,open=ui.jx[D.id]!==undefined?ui.jx[D.id]:cur;ui.jx[D.id]=!open;render();break;}
 case 'jopen':{const n=flat().find(x=>x.id===D.id);if(!n)break;const nx=nextNode();if(!jdone(n)&&nx&&n.i>nx.i){ui.sheet={title:'Jump ahead?',html:'<p>This step is further along your journey.</p><p class="de">Auf Deutsch: Du kannst vorspringen. Alle Schritte davor werden als übersprungen markiert. Ihre Wörter findest du weiterhin unter Topics.</p><button class="btn block" data-act="jjump" data-id="'+esc(n.id)+'">Jump here</button>'};renderSheet();}else launch(n);break;}
 case 'jjump':{const all=flat(),n=all.find(x=>x.id===D.id);if(n){all.forEach(x=>{if(x.i<n.i&&!jdone(x))S.jny[x.id]=-1;});save();ui.sheet=null;launch(n);}break;}
 
 case 'audtest':AU.htmlBad=false;AU.lastErr='';say('Bom dia! Como está?',false,true);toast('Playing a test phrase');setTimeout(()=>{if(ui.sheet&&ui.sheet.kind==='settings')renderSheet();},3200);break;
 case 'csub':chkSub();break;
 case 'cnext':chkNext();break;
 case 'cexit':{const hn=ui.c&&ui.c.node;if(hn)toJourney();else{ui.c=null;ui.screen='progress';render();window.scrollTo(0,0);}break;}
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b);});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.chg==='voice'){S.voice=t.value;save();}});
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.id==='tin'&&e.key==='Enter'){e.preventDefault();chkSub();return;}
 if(ui.g&&ui.g.k==='quest'&&(e.code==='Space'||e.code==='ArrowUp')&&!(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))){e.preventDefault();qJump();}
 if(e.key==='Enter'&&e.target&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();e.target.click();}
});
window.__app={AU,say,sfx,hasClip,flat,nextNode,journey,jdone,launch,gsrc,S:()=>S,ui:()=>ui,render,act,WORDS,TB,path,pool,mkQ,startMill,startBuild,startListen,startMatch,startQuest,chkStart,dStart,startSession,newIds,dueIds};
plLoad();load();render();
})();
</script>
