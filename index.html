{n:'Bom dia! Tu és o novo colega, certo?',e:'Good morning! You are the new colleague, right?',de:'Colega heißt Kollege oder Kollegin. Certo? am Ende heißt richtig?',o:[['Sim, sou eu. Chamo-me Alex. Prazer em conhecer-te!','Yes, that is me. My name is Alex. Nice to meet you!',1],['Não, eu sou o chefe do café.','No, I am the boss of the café.',0],['Sim, estou cansado e quero dormir.','Yes, I am tired and want to sleep.',0]]},
{n:'Bem-vindo! O horário é das nove às cinco. Tens perguntas?',e:'Welcome! The hours are from nine to five. Do you have questions?',de:'Horário heißt Arbeitszeiten. Das nove às cinco heißt von neun bis fünf. Tens perguntas? heißt Hast du Fragen?',o:[['Sim. A que horas é o almoço?','Yes. What time is lunch?',1],['Sim, onde é a minha cama?','Yes, where is my bed?',0],['Não, eu como peixe ao jantar.','No, I eat fish at dinner.',0]]},
{n:'O almoço é à uma hora. Se precisares de ajuda, diz-me.',e:'Lunch is at one o\'clock. If you need help, tell me.',de:'Bei Uhrzeiten sagt man à uma (um 1 Uhr) und às duas (um 2 Uhr). Diz-me heißt sag mir.',o:[['Obrigado! Ainda não percebo tudo, mas estou a aprender.','Thanks! I do not understand everything yet, but I am learning.',1],['Obrigado! Eu tenho três filhos.','Thanks! I have three children.',0],['Desculpe, hoje é domingo.','Sorry, today is Sunday.',0]]},
{n:'Não faz mal! Vamos tomar um café?',e:'No problem! Shall we have a coffee?',de:'Não faz mal heißt macht nichts. Vamos heißt wir gehen oder lass uns.',o:[['Boa ideia! Vamos.','Good idea! Let us go.',1],['Não, eu sou da Alemanha.','No, I am from Germany.',0],['Ontem, às oito.','Yesterday, at eight.',0]]}]},
{id:'work2',n:'A problem at work',who:'Your boss',l:3,g:'work',steps:[
{n:'Bom dia. A máquina está avariada. Pode ajudar-me?',e:'Good morning. The machine is out of order. Can you help me?',de:'Avariado heißt defekt, typisch für Maschinen und Autos. Pode ajudar-me? heißt Können Sie mir helfen? (höflich)',o:[['Claro! Vou ver o que se passa.','Of course! I will see what is going on.',1],['Sim, a máquina é muito bonita.','Yes, the machine is very pretty.',0],['Ontem foi domingo.','Yesterday was Sunday.',0]]},
{n:'Precisamos dela hoje. É urgente.',e:'We need it today. It is urgent.',de:'Dela heißt von ihr (der Maschine). Urgente heißt dringend.',o:[['Percebo. Vou chamar o técnico agora.','I understand. I will call the technician now.',1],['Boa ideia, vamos tomar um café.','Good idea, let us have a coffee.',0],['Não percebo, tenho férias.','I do not understand, I am on holiday.',0]]},
{n:'Quanto tempo demora?',e:'How long will it take?',de:'Demorar heißt dauern. Du kannst schätzen: Acho que uma hora. (Ich glaube, eine Stunde.)',o:[['Acho que uma hora. Aviso quando estiver pronto.','I think an hour. I will let you know when it is ready.',1],['São dois euros e vinte.','It is two euros twenty.',0],['Estou com fome.','I am hungry.',0]]},
{n:'Obrigado. Bom trabalho!',e:'Thank you. Good work!',de:'Bom trabalho! ist eine übliche Verabschiedung unter Kollegen.',o:[['De nada. Até logo!','You are welcome. See you later!',1],['Desculpe, eu sou o chefe.','Sorry, I am the boss.',0],['Boa noite, bom dia.','Good night, good morning.',0]]}]},
{id:'family',n:'Visiting a friend\'s family',who:'Dona Teresa',l:2,g:'social',steps:[
{n:'Boa tarde! Entre, entre! Está em sua casa.',e:'Good afternoon! Come in, come in! Make yourself at home.',de:'Wörtlich: Sie sind in Ihrem Zuhause. Eine herzliche Floskel. Dona ist die respektvolle Anrede für ältere Frauen.',o:[['Boa tarde, Dona Teresa! Muito prazer. Obrigado pelo convite.','Good afternoon, Dona Teresa! A pleasure. Thank you for the invitation.',1],['Adeus! Até amanhã.','Goodbye! See you tomorrow.',0],['Desculpe, onde fica a estação?','Sorry, where is the station?',0]]},
{n:'Está à vontade! Quer beber alguma coisa? Um café, um sumo?',e:'Make yourself comfortable! Would you like something to drink? A coffee, a juice?',de:'Está à vontade heißt fühl dich wie zu Hause. Sumo heißt Saft.',o:[['Um sumo, por favor. Obrigado.','A juice, please. Thank you.',1],['Sim, tenho vinte anos.','Yes, I am twenty years old.',0],['Não, eu não falo português.','No, I do not speak Portuguese.',0]]},
{n:'Gosta de peixe? Fiz bacalhau para o almoço.',e:'Do you like fish? I made cod for lunch.',de:'Bacalhau ist getrockneter Kabeljau, das portugiesische Nationalgericht. Fiz heißt ich habe gemacht.',o:[['Gosto muito! Tem um cheiro ótimo.','I like it a lot! It smells great.',1],['Sim, a conta, por favor.','Yes, the bill, please.',0],['Não percebo. Onde fica o metro?','I do not understand. Where is the metro?',0]]},
{n:'Então, vamos para a mesa! Bom apetite!',e:'Well then, let us go to the table! Enjoy your meal!',de:'Auf Bom apetite! antwortet man mit Igualmente oder Bom apetite também!',o:[['Obrigado! Bom apetite também!','Thank you! Enjoy your meal too!',1],['Boa noite, durmo bem.','Good night, I sleep well.',0],['Quanto custa?','How much does it cost?',0]]}]}
];

{id:'cafe',n:'At the café',who:'Rita, waitress',l:1,g:'daily travel social',steps:[

X('Prazer! De onde és?','Nice to meet you! Where are you from?','De onde és? heißt Woher kommst du? És ist die tu-Form von ser. Antwort: Sou de ... oder Sou da ...','Sou da Alemanha. E tu?','I am from Germany. And you?','Estou na casa de banho.','I am in the bathroom.','Eu gosto de cerveja.','I like beer.'),

X('Que bom! O que fazes no teu tempo livre?','How nice! What do you do in your free time?','Tempo livre heißt Freizeit. Erzähle von deinen Hobbys.','Gosto de caminhar na praia e de ver filmes.','I like walking on the beach and watching films.','Trabalho como médico às segundas.','I work as a doctor on Mondays.','Desculpe, não tenho troco.','Sorry, I have no change.'),
X('Eu também! Queres tomar um café um dia destes?','Me too! Do you want to have a coffee one of these days?','Um dia destes heißt demnächst mal. Eine typische Einladung.','Boa ideia! Dás-me o teu número?','Good idea! Will you give me your number?','Não, eu bebo sopa.','No, I drink soup.','Sim, são três euros.','Yes, it is three euros.'),

X('De nada! Boa viagem!','You are welcome! Have a good trip!','Boa viagem heißt gute Reise.','Obrigado! Boa tarde!','Thanks! Good afternoon!','Boa noite, eu sou o comboio.','Good night, I am the train.','Até amanhã, professor!','See you tomorrow, teacher!')]},

{id:'pharm',n:'At the pharmacy',who:'The pharmacist',l:2,g:'daily travel',steps:[

{id:'work1',n:'First day at work',who:'Sofia, colleague',l:2,g:'work social',steps:[
X('Bom dia! Tu és o novo colega, certo?','Good morning! You are the new colleague, right?','Colega heißt Kollege oder Kollegin. Certo? am Ende heißt richtig?','Sim, sou eu. Chamo-me Alex. Prazer em conhecer-te!','Yes, that is me. My name is Alex. Nice to meet you!','Não, eu sou o chefe do café.','No, I am the boss of the café.','Sim, estou cansado e quero dormir.','Yes, I am tired and want to sleep.'),
X('Bem-vindo! O horário é das nove às cinco. Tens perguntas?','Welcome! The hours are from nine to five. Do you have questions?','Horário heißt Arbeitszeiten. Das nove às cinco heißt von neun bis fünf. Tens perguntas? heißt Hast du Fragen?','Sim. A que horas é o almoço?','Yes. What time is lunch?','Sim, onde é a minha cama?','Yes, where is my bed?','Não, eu como peixe ao jantar.','No, I eat fish for dinner.'),
X('O almoço é à uma hora. Se precisares de ajuda, diz-me.','Lunch is at one o\'clock. If you need help, tell me.','Bei Uhrzeiten sagt man à uma (um 1 Uhr) und às duas (um 2 Uhr). Diz-me heißt sag mir.','Obrigado! Ainda não percebo tudo, mas estou a aprender.','Thanks! I do not understand everything yet, but I am learning.','Obrigado! Eu tenho três filhos.','Thanks! I have three children.','Desculpe, hoje é domingo.','Sorry, today is Sunday.'),
X('Não faz mal! Esta é a tua secretária e este é o teu computador.','No problem! This is your desk and this is your computer.','Secretária heißt hier Schreibtisch. Bei Fragen zum Computer brauchst du die palavra-passe (Passwort).','Obrigado. Qual é a palavra-passe?','Thanks. What is the password?','A secretária é muito simpática.','The desk is very friendly.','Sim, quero uma sopa.','Yes, I want a soup.'),
X('Está neste papel. Às dez temos uma reunião de equipa.','It is on this paper. At ten we have a team meeting.','Reunião heißt Besprechung, equipa heißt Team (in Brasilien: equipe).','Está bem. Onde é a reunião?','Okay. Where is the meeting?','A reunião é a minha prima.','The meeting is my cousin.','Às dez vou à praia.','At ten I am going to the beach.'),
X('Na sala ao fundo do corredor. Eu levo-te lá.','In the room at the end of the corridor. I will take you there.','Ao fundo do corredor heißt am Ende des Flurs. Eu levo-te heißt ich bringe dich hin.','És muito simpática. Obrigado!','You are very kind. Thanks!','Não, o corredor é perigoso.','No, the corridor is dangerous.','Levo o meu cão, obrigado.','I am taking my dog, thanks.'),
X('Não faz mal! Vamos tomar um café antes?','No problem! Shall we have a coffee before?','Não faz mal heißt macht nichts. Vamos heißt wir gehen oder lass uns.','Boa ideia! Vamos.','Good idea! Let us go.','Não, eu sou da Alemanha.','No, I am from Germany.','Ontem, às oito.','Yesterday, at eight.'),
X('Então, como está a correr o primeiro dia?','So, how is the first day going?','Como está a correr? heißt Wie läuft es? Correr bem heißt gut laufen.','Está a correr muito bem, obrigado!','It is going very well, thanks!','Estou a correr para o comboio.','I am running for the train.','Correu mal o peixe.','The fish went badly.')]},
{id:'work2',n:'A problem at work',who:'Your boss',l:3,g:'work',steps:[

X('Quanto tempo demora?','How long will it take?','Demorar heißt dauern. Du kannst schätzen: Acho que uma hora. (Ich glaube, eine Stunde.)','Acho que uma hora. Aviso quando estiver pronto.','I think an hour. I will let you know when it is ready.','São dois euros e vinte.','It is two euros twenty.','Estou com fome.','I am hungry.'),
X('Está bem. Entretanto, pode fazer o relatório da semana?','Okay. Meanwhile, can you do the weekly report?','Entretanto heißt inzwischen. Relatório heißt Bericht.','Posso. Envio-lhe o relatório até às três.','I can. I will send you the report by three.','Não, o relatório está constipado.','No, the report has a cold.','Entretanto o comboio partiu.','Meanwhile the train left.'),

{id:'family',n:'Visiting a friend\'s family',who:'Dona Teresa',l:2,g:'social',steps:[
X('Boa tarde! Entre, entre! Está em sua casa.','Good afternoon! Come in, come in! Make yourself at home.','Wörtlich: Sie sind in Ihrem Zuhause. Eine herzliche Floskel. Dona ist die respektvolle Anrede für ältere Frauen.','Boa tarde, Dona Teresa! Muito prazer. Obrigado pelo convite.','Good afternoon, Mrs Teresa! Very nice to meet you. Thank you for the invitation.','Adeus! Até amanhã.','Goodbye! See you tomorrow.','Não percebo. Onde fica o metro?','I do not understand. Where is the metro?'),
X('Está à vontade! Quer beber alguma coisa? Um café, um sumo?','Make yourself comfortable! Would you like something to drink? A coffee, a juice?','Está à vontade heißt fühl dich wie zu Hause. Sumo heißt Saft.','Um sumo, por favor. Obrigado.','A juice, please. Thank you.','Sim, tenho vinte anos.','Yes, I am twenty years old.','Não, eu não falo português.','No, I do not speak Portuguese.'),
X('Trouxe flores? Que simpático! Não era preciso.','You brought flowers? How kind! There was no need.','Bei einer Einladung bringt man oft Blumen, Wein oder Kuchen mit. Não era preciso ist eine höfliche Floskel.','É só uma lembrança. A sua casa é muito bonita!','It is just a small gift. Your house is very beautiful!','Não, as flores são para o meu cão.','No, the flowers are for my dog.','Sim, preciso de um médico.','Yes, I need a doctor.'),
X('Obrigada! Este é o meu marido, o senhor António.','Thank you! This is my husband, Mr António.','Senhor ist die höfliche Anrede für Männer. Begrüße ihn mit Muito prazer.','Muito prazer, senhor António!','Very nice to meet you, Mr António!','O seu marido é muito barato.','Your husband is very cheap.','Prazer, eu sou o metro.','Nice to meet you, I am the metro.'),
X('Gosta de peixe? Fiz bacalhau para o almoço.','Do you like fish? I made cod for lunch.','Bacalhau ist getrockneter Kabeljau, das portugiesische Nationalgericht. Fiz heißt ich habe gemacht.','Gosto muito! Tem um cheiro ótimo.','I like it a lot! It smells great.','Sim, a conta, por favor.','Yes, the bill, please.','Não percebo. Onde fica o metro?','I do not understand. Where is the metro?'),
X('Então, vamos para a mesa! Bom apetite!','Well then, let us go to the table! Enjoy your meal!','Auf Bom apetite! antwortet man mit Igualmente oder Bom apetite também!','Obrigado! Bom apetite também!','Thank you! Enjoy your meal too!','Boa noite, durmo bem.','Good night, I sleep well.','Quanto custa?','How much is it?'),
X('Quer mais um bocadinho? Há muito!','Would you like a little more? There is plenty!','Bocadinho heißt ein kleines bisschen. Portugiesische Gastgeber bieten immer wieder nach.','Estava delicioso, mas já estou cheio!','It was delicious, but I am already full!','Sim, mais um bocadinho de metro.','Yes, a little more metro.','Não, eu sou alemão.','No, I am German.'),
X('Volte sempre! A porta está sempre aberta.','Come back any time! The door is always open.','Volte sempre heißt Kommen Sie jederzeit wieder. Bedanke dich zum Abschied.','Muito obrigado por tudo! Até breve!','Thank you very much for everything! See you soon!','A porta está avariada.','The door is broken.','Sempre às segundas, obrigado.','Always on Mondays, thank you.')]},
{id:'market',n:'At the market',who:'Senhor Joaquim, fruit seller',l:1,g:'daily travel',steps:[
X('Bom dia! Hoje está tudo fresquinho!','Good morning! Today everything is nice and fresh!','Fresquinho heißt schön frisch. Die Verkleinerung mit -inho klingt freundlich und ist in Portugal sehr häufig.','Bom dia! Quanto custam os morangos?','Good morning! How much are the strawberries?','Bom dia! Eu estou fresquinho.','Good morning! I am nice and fresh.','Desculpe, sou o seu vizinho.','Sorry, I am your neighbour.'),
X('Os morangos estão a três euros o quilo.','The strawberries are three euros a kilo.','O quilo heißt pro Kilo. Bei Mengen: meio quilo (ein halbes Kilo).','Então quero meio quilo, por favor.','Then I want half a kilo, please.','O quilo é muito simpático.','The kilo is very nice.','Três euros é muito sério.','Three euros is very serious.'),
X('Mais alguma coisa? As laranjas do Algarve estão ótimas.','Anything else? The oranges from the Algarve are great.','Orangen aus der Algarve sind berühmt in Portugal.','Sim, um quilo de laranjas e duas cebolas.','Yes, a kilo of oranges and two onions.','Não, o Algarve é longe da praia.','No, the Algarve is far from the beach.','Sim, a minha laranja é professora.','Yes, my orange is a teacher.'),
X('Quer um saco?','Do you want a bag?','Saco heißt Tüte. Viele bringen ihre eigene Tasche mit.','Não, obrigado. Tenho o meu saco.','No, thanks. I have my bag.','Sim, quero um saco de dormir.','Yes, I want a sleeping bag.','O saco está constipado.','The bag has a cold.'),
X('Prove esta uva. É doce como mel!','Try this grape. It is as sweet as honey!','Prove heißt probieren Sie. Doce heißt süß.','Hum, é mesmo doce! Quero um cacho.','Mmm, it really is sweet! I want a bunch.','Não, eu não gosto de mel no carro.','No, I do not like honey in the car.','A uva está atrasada.','The grape is late.'),
X('São seis euros e quarenta, mas fica seis euros.','That is six euros forty, but make it six euros.','Fica seis euros heißt ich mache dir sechs Euro, ein kleiner Rabatt.','Que simpático! Obrigado. Aqui tem.','How kind! Thank you. Here you are.','Não, prefiro pagar mais.','No, I prefer to pay more.','Seis euros é a minha morada.','Six euros is my address.'),
X('Obrigado eu! Até sábado!','Thank you! See you on Saturday!','Obrigado eu heißt Ich danke Ihnen. Viele Märkte sind am Samstag.','Até sábado, senhor Joaquim!','See you on Saturday, Mr Joaquim!','Sábado é a minha irmã.','Saturday is my sister.','Até ontem!','See you yesterday!')]},
{id:'train',n:'Buying a train ticket',who:'Ticket office',l:1,g:'travel daily',steps:[
X('Boa tarde. Diga, por favor.','Good afternoon. Go ahead, please.','Diga heißt wörtlich sagen Sie. So fordert man dich am Schalter auf, dein Anliegen zu sagen.','Boa tarde. Um bilhete para o Porto, por favor.','Good afternoon. A ticket to Porto, please.','Boa tarde. Diga você.','Good afternoon. You say it.','Quero um quarto duplo.','I want a double room.'),
X('Só ida ou ida e volta?','One way or return?','Só ida heißt einfache Fahrt, ida e volta hin und zurück.','Ida e volta, por favor.','Return, please.','Ida ao médico, obrigado.','A trip to the doctor, thanks.','Volta à direita.','Turn back right.'),
X('Para quando?','For when?','Para quando heißt für wann.','Para amanhã de manhã, se possível.','For tomorrow morning, if possible.','Para a minha mãe.','For my mother.','Quando o gato dormir.','When the cat sleeps.'),
X('Há um Alfa Pendular às oito e um Intercidades às nove e meia.','There is an Alfa Pendular at eight and an Intercity at half past nine.','Alfa Pendular ist der schnelle Zug, Intercidades der normale Fernzug.','O das oito, por favor. Quanto tempo demora?','The eight o\'clock one, please. How long does it take?','O das oito é muito alto.','The eight o\'clock one is very tall.','Às nove e meia como sopa.','At half past nine I eat soup.'),
X('Demora cerca de três horas. Primeira ou segunda classe?','It takes about three hours. First or second class?','Cerca de heißt ungefähr. Turística ist die zweite Klasse.','Segunda classe, por favor.','Second class, please.','Primeira, sou o primeiro filho.','First, I am the first son.','Três horas e meia de queijo.','Three and a half hours of cheese.'),
X('Janela ou corredor?','Window or aisle?','Janela heißt Fenster, corredor heißt Gang.','Janela, por favor. Gosto de ver a paisagem.','Window, please. I like to see the landscape.','Corredor, porque estou com fome.','Aisle, because I am hungry.','A janela está casada.','The window is married.'),
X('São cinquenta e oito euros. A partida é da linha três.','That is fifty-eight euros. Departure is from platform three.','Linha heißt hier Gleis.','Obrigado. A que horas chega ao Porto?','Thank you. What time does it arrive in Porto?','Linha três é o meu número.','Line three is my number.','Cinquenta e oito anos, obrigado.','Fifty-eight years old, thank you.'),
X('Chega às onze e dez a Campanhã. Boa viagem!','It arrives at ten past eleven at Campanhã. Have a good trip!','Campanhã ist der große Bahnhof in Porto.','Muito obrigado! Boa tarde!','Thank you very much! Good afternoon!','Campanhã é muito picante.','Campanhã is very spicy.','Boa viagem para si também, bilhete!','Have a good trip too, ticket!')]},
{id:'hotel',n:'Checking in at the hotel',who:'Receptionist',l:2,g:'travel',steps:[
X('Boa noite, bem-vindo! Em que posso ajudar?','Good evening, welcome! How can I help?','An der Rezeption. Du sagst, dass du eine Reservierung hast.','Boa noite. Tenho uma reserva em nome de Alex Weber.','Good evening. I have a reservation in the name of Alex Weber.','Boa noite. Quero um bacalhau.','Good evening. I want a cod.','Tenho uma reserva de sardinhas.','I have a sardine reservation.'),
X('Sim, um quarto duplo para três noites. Pode mostrar o passaporte?','Yes, a double room for three nights. Can you show your passport?','Noites heißt Nächte. Passaporte ist der Pass, oft reicht auch der Ausweis.','Claro, aqui está.','Of course, here it is.','Não, o passaporte está a dormir.','No, the passport is sleeping.','Três noites de fado, obrigado.','Three nights of fado, thanks.'),
X('Obrigado. O pequeno-almoço é das sete às dez, no primeiro andar.','Thank you. Breakfast is from seven to ten, on the first floor.','Das sete às dez heißt von sieben bis zehn.','Perfeito. Há wi-fi no quarto?','Perfect. Is there wi-fi in the room?','Das sete às dez eu nado.','From seven to ten I swim.','O primeiro andar é muito simpático.','The first floor is very nice.'),
X('Há, sim. A palavra-passe está no cartão do quarto.','Yes, there is. The password is on the room card.','Há, sim heißt ja, gibt es.','Obrigado. E a que horas é o check-out?','Thank you. And what time is check-out?','O cartão é muito alto.','The card is very tall.','Não há, sim, talvez.','There is not, yes, maybe.'),
X('Até ao meio-dia. Precisa de ajuda com a bagagem?','By noon. Do you need help with the luggage?','Até ao meio-dia heißt bis Mittag.','Não, obrigado. É só uma mala.','No, thanks. It is just one suitcase.','Sim, a bagagem quer um café.','Yes, the luggage wants a coffee.','Ao meio-dia é meia-noite.','At noon it is midnight.'),
X('Muito bem. Quer que lhe recomende um restaurante aqui perto?','Very well. Would you like me to recommend a restaurant nearby?','Quer que lhe recomende? heißt Soll ich Ihnen etwas empfehlen? Lhe heißt Ihnen.','Sim, por favor! Gostava de comer peixe.','Yes, please! I would like to eat fish.','Não, eu como o quarto.','No, I eat the room.','Aqui perto está a minha avó.','My grandmother is nearby.'),
X('A Tasca do Zé, na rua ao lado. Diga que vem da nossa parte.','Tasca do Zé, on the next street. Say that we sent you.','Da nossa parte heißt von uns empfohlen. Tasca ist ein kleines, einfaches Lokal.','Ótimo, obrigado pela dica!','Great, thanks for the tip!','A rua ao lado é o meu irmão.','The next street is my brother.','Diga você, eu não falo.','You say it, I do not speak.'),
X('De nada. O seu quarto é o duzentos e quinze. Boa estadia!','You are welcome. Your room is two hundred and fifteen. Enjoy your stay!','Boa estadia heißt schönen Aufenthalt.','Obrigado! Boa noite!','Thanks! Good night!','Duzentos e quinze euros? Que caro!','Two hundred and fifteen euros? How expensive!','Boa estadia, quarto!','Enjoy your stay, room!')]},
{id:'doctor',n:'At the doctor\'s',who:'Dra. Marta',l:2,g:'daily work travel',steps:[
X('Bom dia. Sente-se, por favor. O que se passa?','Good morning. Please sit down. What is the matter?','Sente-se heißt setzen Sie sich. O que se passa? heißt was ist los?','Bom dia, doutora. Estou constipado e tenho tosse.','Good morning, doctor. I have a cold and a cough.','Bom dia. Passa-se o comboio.','Good morning. The train is passing.','Sente-se você, eu estou bem.','You sit down, I am fine.'),
X('Há quantos dias?','For how many days?','Há quantos dias? heißt seit wie vielen Tagen?','Há quatro dias. E dói-me a garganta.','For four days. And my throat hurts.','Há quatro gatos em casa.','There are four cats at home.','Quantos dias tem o mês?','How many days does the month have?'),
X('Tem febre?','Do you have a fever?','Febre heißt Fieber. Graus heißt Grad.','Ontem tive trinta e oito graus.','Yesterday I had thirty-eight degrees.','Tenho febre de futebol.','I have football fever.','Sim, tenho um carro novo.','Yes, I have a new car.'),
X('Vou ouvir os pulmões. Respire fundo, por favor.','I am going to listen to your lungs. Breathe deeply, please.','Respire fundo heißt tief einatmen.','Está bem.','Okay.','Não, eu não respiro às segundas.','No, I do not breathe on Mondays.','Os pulmões são caros.','The lungs are expensive.'),
X('Não é nada grave, é uma gripe. Vou passar-lhe um xarope.','It is nothing serious, it is flu. I will prescribe you a syrup.','Grave heißt schlimm. Passar uma receita heißt ein Rezept ausstellen.','Ainda bem! Quantas vezes por dia?','Thank goodness! How many times a day?','Que pena, eu queria uma pizza.','What a pity, I wanted a pizza.','Grave é o meu chefe.','My boss is serious.'),
X('Três vezes por dia, depois das refeições. E beba muita água.','Three times a day, after meals. And drink a lot of water.','Refeições heißt Mahlzeiten. Beba ist die höfliche Befehlsform von beber.','Percebi. Posso ir trabalhar?','Understood. Can I go to work?','Três vezes por dia vou à praia.','Three times a day I go to the beach.','Bebo muita água do mar.','I drink a lot of seawater.'),
X('É melhor ficar em casa dois dias. Passo-lhe uma baixa.','It is better to stay at home for two days. I will give you a sick note.','Baixa (médica) ist die Krankschreibung.','Obrigado, doutora. Muito amável.','Thank you, doctor. Very kind.','Não, prefiro a baixa da cidade.','No, I prefer the downtown area.','Dois dias de bacalhau.','Two days of cod.'),
X('De nada. Melhoras!','You are welcome. Get well soon!','Melhoras! heißt gute Besserung.','Obrigado. Bom dia!','Thank you. Good day!','Melhoras para o seu carro!','Get well to your car!','Até amanhã na praia!','See you tomorrow at the beach!')]},
{id:'neighbour',n:'Your new neighbour',who:'Dona Lurdes',l:1,g:'social daily',steps:[
X('Olá! É o novo vizinho do segundo andar?','Hello! Are you the new neighbour from the second floor?','Andar heißt Stockwerk. Ältere Menschen siezen dich oft mit der 3. Person.','Sou, sim! Mudei-me na semana passada.','Yes, I am! I moved in last week.','Não, eu sou o elevador.','No, I am the lift.','Sim, eu sou de segunda-feira.','Yes, I am from Monday.'),
X('Seja bem-vindo! Eu sou a Lurdes, moro aqui há trinta anos.','Welcome! I am Lurdes, I have lived here for thirty years.','Há trinta anos heißt seit dreißig Jahren.','Muito prazer, Dona Lurdes! Eu sou o Alex.','Very nice to meet you, Mrs Lurdes! I am Alex.','Trinta anos é muito barato.','Thirty years is very cheap.','Moro no comboio.','I live on the train.'),
X('Está a gostar do bairro?','Are you enjoying the neighbourhood?','Bairro heißt Viertel. Está a gostar? heißt Gefällt es Ihnen (gerade)?','Muito! É calmo e tem tudo perto.','Very much! It is quiet and everything is close.','Não, o bairro está constipado.','No, the neighbourhood has a cold.','Gosto de bacalhau às três.','I like cod at three.'),
X('A padaria ao fundo da rua tem o melhor pão. Abre às sete.','The bakery at the end of the street has the best bread. It opens at seven.','Ao fundo da rua heißt am Ende der Straße. Abre heißt öffnet.','Obrigado pela dica! Vou amanhã de manhã.','Thanks for the tip! I will go tomorrow morning.','Às sete eu sou padeiro.','At seven I am a baker.','O pão é o meu vizinho.','The bread is my neighbour.'),
X('E o lixo recolhe-se à noite. O contentor fica na esquina.','And rubbish is collected at night. The container is on the corner.','Lixo heißt Müll, contentor die Mülltonne. In Portugal gibt es Container für Papier, Glas und Plastik.','Ah, não sabia. Obrigado!','Ah, I did not know. Thank you!','A esquina come lixo.','The corner eats rubbish.','O contentor é muito simpático.','The container is very nice.'),
X('Se precisar de alguma coisa, é só bater à porta.','If you need anything, just knock on the door.','Bater à porta heißt an die Tür klopfen.','É muito simpática. O mesmo para si!','You are very kind. The same goes for you!','Vou bater no elevador.','I am going to hit the lift.','Preciso de uma porta nova.','I need a new door.'),
X('Ai, que rapaz educado! Até logo!','Oh, what a polite young man! See you later!','Educado heißt höflich, nicht gebildet.','Até logo, Dona Lurdes! Bom dia!','See you later, Mrs Lurdes! Have a good day!','Até logo, padaria!','See you later, bakery!','Sou educado em Berlim.','I am polite in Berlin.')]},
{id:'phonecall',n:'A phone call at work',who:'A client',l:2,g:'work',steps:[
X('Está? Bom dia, é da empresa Sol e Mar?','Hello? Good morning, is this the Sol e Mar company?','Am Telefon sagt man in Portugal Está? oder Estou? Du meldest dich mit dem Firmennamen.','Sim, bom dia. Fala Alex. Em que posso ajudar?','Yes, good morning. Alex speaking. How can I help?','Não, é da minha avó.','No, it is my grandmother\'s.','Está calor, obrigado.','It is hot, thank you.'),
X('Queria falar com o senhor Rui Costa, por favor.','I would like to speak to Mr Rui Costa, please.','Queria falar com heißt Ich möchte sprechen mit (höflich).','Um momento, por favor. Quem fala?','One moment, please. Who is speaking?','O senhor Rui é muito alto.','Mr Rui is very tall.','Fale mais tarde, estou a comer.','Speak later, I am eating.'),
X('É a Ana Silva, da empresa Atlântico.','It is Ana Silva, from the Atlântico company.','Notiere dir Namen und Firma.','Obrigado, Dona Ana. Vou passar a chamada.','Thank you, Ms Ana. I will put you through.','Atlântico? Eu gosto de nadar.','Atlântico? I like swimming.','Passo a chamada para a praia.','I will put the call through to the beach.'),
X('Obrigada, eu espero.','Thank you, I will wait.','Die Kundin wartet. Du kommst zurück: Herr Costa ist in einer Besprechung. Recado heißt Nachricht.','Lamento, o senhor Costa está numa reunião. Quer deixar recado?','I am sorry, Mr Costa is in a meeting. Would you like to leave a message?','Lamento, o senhor Costa é muito alto.','I am sorry, Mr Costa is very tall.','Espere na praia, por favor.','Wait at the beach, please.'),
X('Sim, por favor. Pode pedir-lhe para me ligar?','Yes, please. Can you ask him to call me?','Pedir para ligar heißt um Rückruf bitten. Frag nach der Nummer.','Claro. Qual é o seu número?','Of course. What is your number?','Não, ele não gosta de telefones.','No, he does not like phones.','Ligo-lhe a luz.','I will turn on the light for you.'),
X('É o nove três seis, quatro cinco dois, um um oito.','It is nine three six, four five two, one one eight.','Telefonnummern sagt man in Dreiergruppen. Bitte um Wiederholung, wenn es zu schnell war.','Pode repetir mais devagar, por favor?','Can you repeat it more slowly, please?','Mais depressa, por favor!','Faster, please!','O meu número é trinta e oito no pé.','My shoe size is thirty-eight.'),
X('Nove, três, seis... quatro, cinco, dois... um, um, oito.','Nine, three, six... four, five, two... one, one, eight.','Lies die Nummer zur Bestätigung vor oder sag, dass du sie notiert hast.','Perfeito, anotei. Ele liga-lhe ainda hoje.','Perfect, I have noted it. He will call you back today.','Anotei o bacalhau.','I noted the cod.','Ainda hoje vou ao dentista.','Today I am still going to the dentist.'),
X('Muito obrigada. Bom dia!','Thank you very much. Have a good day!','Verabschiede dich höflich.','De nada. Bom dia, Dona Ana!','You are welcome. Good day, Ms Ana!','Bom dia, telefone!','Good day, phone!','Até ontem, Dona Ana!','See you yesterday, Ms Ana!')]},
{id:'flat',n:'Renting a flat',who:'Senhor Paulo, landlord',l:3,g:'daily',steps:[
X('Boa tarde! Veio ver o apartamento?','Good afternoon! Have you come to see the flat?','Apartamento heißt Wohnung. Ein T2 hat zwei Schlafzimmer.','Boa tarde! Sim, vi o anúncio na internet.','Good afternoon! Yes, I saw the advert online.','Não, vim ver o futebol.','No, I came to watch football.','Sim, o apartamento é meu amigo.','Yes, the flat is my friend.'),
X('Ora bem, é um T1 com sala, cozinha e casa de banho.','Well then, it is a one-bedroom flat with living room, kitchen and bathroom.','T1 heißt eine Wohnung mit einem Schlafzimmer. Ora bem heißt also gut.','A cozinha é equipada?','Is the kitchen fitted?','O T1 é muito engraçado.','The T1 is very funny.','Ora bem, ora mal.','Well, badly.'),
X('Sim, tem fogão, forno, frigorífico e máquina de lavar.','Yes, it has a stove, oven, fridge and washing machine.','Equipada heißt ausgestattet.','Ótimo. Quanto é a renda?','Great. How much is the rent?','Não gosto de frigoríficos.','I do not like fridges.','A máquina lava o meu carro?','Does the machine wash my car?'),
X('São setecentos euros por mês. O condomínio está incluído.','It is seven hundred euros a month. The building fees are included.','Condomínio sind die Nebenkosten für das Gebäude. Strom und Wasser zahlt man meist extra.','E a luz e a água?','And electricity and water?','Setecentos euros por dia?','Seven hundred euros a day?','O condomínio é o meu tio.','The building fees are my uncle.'),
X('A luz, a água e o gás são à parte. Pedimos dois meses de caução.','Electricity, water and gas are separate. We ask for two months deposit.','À parte heißt extra. Caução heißt Kaution.','Percebo. É preciso fiador?','I understand. Is a guarantor needed?','À parte de quê?','Apart from what?','A caução é muito simpática.','The deposit is very nice.'),
X('Se tiver contrato de trabalho, não é preciso.','If you have an employment contract, it is not necessary.','Fiador ist ein Bürge. Mit Arbeitsvertrag (contrato de trabalho) braucht man oft keinen.','Tenho, sim. Trabalho numa empresa em Lisboa.','Yes, I do. I work for a company in Lisbon.','Não tenho, mas tenho um gato.','I do not, but I have a cat.','Contrato um canalizador.','I am hiring a plumber.'),
X('Ótimo. Quer pensar ou já decidiu?','Great. Do you want to think about it or have you already decided?','Decidir heißt entscheiden.','Gosto muito. Posso assinar o contrato amanhã?','I like it a lot. Can I sign the contract tomorrow?','Quero pensar no bacalhau.','I want to think about the cod.','Já decidi ir à praia.','I have already decided to go to the beach.'),
X('Pode, claro. Traga o cartão de cidadão ou passaporte e o NIF.','Of course. Bring your ID card or passport and your tax number.','NIF ist die Steuernummer, die du in Portugal fast überall brauchst.','Combinado. Até amanhã, senhor Paulo!','Agreed. See you tomorrow, Mr Paulo!','Trago o meu cão também.','I will bring my dog too.','O NIF é muito picante.','The tax number is very spicy.')]},
{id:'party',n:'At a birthday party',who:'Inês, a friend',l:2,g:'social',steps:[
X('Olá! Que bom que vieste!','Hi! So glad you came!','Que bom que vieste! heißt Wie schön, dass du gekommen bist!','Olá, Inês! Parabéns! Isto é para ti.','Hi, Inês! Happy birthday! This is for you.','Olá! Vim de autocarro amarelo.','Hi! I came by yellow bus.','Parabéns para mim!','Happy birthday to me!'),
X('Que giro! Não precisavas. Queres uma bebida?','How lovely! You did not need to. Do you want a drink?','Giro heißt schön, süß. Não precisavas heißt das wäre nicht nötig gewesen.','Sim, um copo de vinho branco, por favor.','Yes, a glass of white wine, please.','Não, eu bebo o presente.','No, I drink the present.','Sim, uma bebida de bacalhau.','Yes, a cod drink.'),
X('Vem, vou apresentar-te os meus amigos. Este é o Tiago.','Come, I will introduce you to my friends. This is Tiago.','Apresentar heißt vorstellen. Unter Freunden gibt man zwei Küsschen (Frauen) oder die Hand / Umarmung.','Olá, Tiago! Tudo bem? Eu sou o Alex.','Hi, Tiago! All good? I am Alex.','Este é o meu copo, obrigado.','This is my glass, thanks.','Adeus, Tiago, até nunca.','Goodbye, Tiago, see you never.'),
X('Tudo e contigo? De onde conheces a Inês?','All good, and with you? Where do you know Inês from?','Tudo e contigo? ist die typische Antwort auf Tudo bem?','Trabalhamos juntos. E tu?','We work together. And you?','Conheço a Inês de amanhã.','I know Inês from tomorrow.','Contigo não, obrigado.','Not with you, thanks.'),
X('Somos amigos da faculdade. Já provaste o bolo? Está divinal!','We are friends from university. Have you tried the cake yet? It is heavenly!','Faculdade heißt Universität / Fakultät. Divinal heißt himmlisch.','Ainda não! Vou provar agora.','Not yet! I will try it now.','Já, provei a faculdade.','Yes, I tried the university.','O bolo é meu professor.','The cake is my teacher.'),
X('Atenção, pessoal! Vamos cantar os parabéns!','Attention, everyone! Let us sing happy birthday!','Pessoal heißt Leute. Cantar os parabéns heißt das Geburtstagslied singen.','Parabéns a você, nesta data querida!','Happy birthday to you, on this dear day!','Não sei cantar, sou alemão.','I cannot sing, I am German.','Pessoal, onde é a estação?','Everyone, where is the station?'),
X('Obrigada, que lindo! Então, ficas até mais tarde?','Thank you, how lovely! So, are you staying until later?','Ficar até mais tarde heißt länger bleiben.','Fico mais um bocado, mas amanhã trabalho cedo.','I will stay a bit longer, but tomorrow I work early.','Fico até ao Natal.','I am staying until Christmas.','Mais tarde é muito cedo.','Later is very early.'),
X('Claro, percebo. Obrigada por teres vindo!','Of course, I understand. Thank you for coming!','Zum Abschied unter Freunden: beijinhos oder um abraço.','Eu é que agradeço! Beijinhos e boa festa!','I am the one who should thank you! Kisses and enjoy the party!','De nada, é o meu trabalho.','You are welcome, it is my job.','Boa festa, bolo!','Enjoy the party, cake!')]},
{id:'clothesshop',n:'Buying clothes',who:'Shop assistant',l:2,g:'daily travel',steps:[
X('Olá, boa tarde! Posso ajudar?','Hello, good afternoon! Can I help?','In Geschäften wirst du oft so angesprochen. Só estou a ver heißt ich schaue nur.','Boa tarde. Procuro um casaco para o inverno.','Good afternoon. I am looking for a coat for the winter.','Boa tarde. Procuro a minha avó.','Good afternoon. I am looking for my grandmother.','Posso ajudar você também?','Can I help you too?'),
X('Que tamanho veste?','What size do you wear?','Vestir heißt (Kleidung) tragen. Größen: S, M, L oder Zahlen.','Visto o M, normalmente.','I usually wear a medium.','Visto o meu cão.','I dress my dog.','O tamanho é muito simpático.','The size is very nice.'),
X('Temos este em azul e em preto.','We have this one in blue and in black.','Farben: azul (blau), preto (schwarz).','Gosto do azul. Posso experimentar?','I like the blue one. Can I try it on?','Gosto do preto, é muito picante.','I like the black one, it is very spicy.','Azul e preto são os meus filhos.','Blue and black are my children.'),
X('Claro. O provador é ali ao fundo.','Of course. The fitting room is down there.','Provador heißt Umkleidekabine. Ali ao fundo heißt dort hinten.','Obrigado. Já volto.','Thanks. I will be right back.','O provador é o meu tio.','The fitting room is my uncle.','Ao fundo do mar?','At the bottom of the sea?'),
X('Então, que tal? Fica-lhe bem?','So, how is it? Does it suit you?','Que tal? heißt wie ist es? Fica-lhe bem? heißt steht es Ihnen?','É um pouco grande. Tem o S?','It is a bit big. Do you have a small?','Fica-me bem na praia.','It suits me on the beach.','É grande como uma casa.','It is as big as a house.'),
X('Tenho, aqui está. Este está em promoção, tem trinta por cento de desconto.','I do, here it is. This one is on sale, it has thirty percent off.','Promoção heißt Angebot, desconto heißt Rabatt.','Que bom! Então levo este.','Great! Then I will take this one.','Trinta por cento de bacalhau?','Thirty percent cod?','Não gosto de descontos.','I do not like discounts.'),
X('São cinquenta e seis euros. Quer saco?','That is fifty-six euros. Do you want a bag?','Viele Geschäfte berechnen die Tüte extra.','Não, obrigado. Posso trocar se for preciso?','No, thanks. Can I exchange it if necessary?','Quero saco de cinquenta euros.','I want a fifty-euro bag.','Não, o saco é muito barulhento.','No, the bag is very noisy.'),
X('Pode, até trinta dias, com o talão.','You can, within thirty days, with the receipt.','Talão heißt Kassenbon. Aufheben!','Perfeito. Muito obrigado! Boa tarde!','Perfect. Thank you very much! Good afternoon!','O talão é o meu irmão.','The receipt is my brother.','Trinta dias de férias!','Thirty days of holiday!')]},
{id:'taxi',n:'Taking a taxi',who:'Taxi driver',l:1,g:'travel daily',steps:[
X('Boa noite! Para onde vamos?','Good evening! Where are we going?','Para onde vamos? heißt Wohin fahren wir?','Boa noite. Para o aeroporto, por favor.','Good evening. To the airport, please.','Boa noite. Vamos para a cama.','Good evening. We are going to bed.','Para onde vai você?','Where are you going?'),

X('Claro. Apertou o cinto?','Sure. Have you fastened your seatbelt?','Apertar o cinto heißt sich anschnallen.','Já apertei, obrigado.','I have fastened it, thanks.','Não, o cinto é para as calças.','No, the belt is for the trousers.','Apertei a mão ao cinto.','I shook hands with the belt.'),
X('É a primeira vez em Lisboa?','Is it your first time in Lisbon?','Primeira vez heißt erstes Mal.','Não, moro cá. Vou visitar a minha família.','No, I live here. I am going to visit my family.','Sim, é a primeira vez no táxi.','Yes, it is the first time in the taxi.','Lisboa é muito cedo.','Lisbon is very early.'),

{id:'interview',n:'A job interview',who:'Dr. Ferreira',l:3,g:'work',steps:[
X('Bom dia, sente-se, por favor. Fale-me um pouco de si.','Good morning, please sit down. Tell me a bit about yourself.','Fale-me de si heißt Erzählen Sie mir von sich. Sehr höflich.','Bom dia. Chamo-me Alex, sou alemão e moro em Lisboa há um ano.','Good morning. My name is Alex, I am German and I have lived in Lisbon for a year.','Bom dia. Sou alto e gosto de sopa.','Good morning. I am tall and I like soup.','Fale você primeiro.','You speak first.'),
X('Que experiência tem nesta área?','What experience do you have in this field?','Experiência heißt Erfahrung, área Bereich.','Trabalhei cinco anos como técnico numa empresa alemã.','I worked for five years as a technician at a German company.','Tenho experiência em dormir.','I have experience in sleeping.','A área é muito bonita.','The area is very beautiful.'),
X('Porque quer trabalhar connosco?','Why do you want to work with us?','Connosco heißt mit uns.','Porque gosto muito dos vossos projetos e quero crescer.','Because I really like your projects and I want to grow.','Porque o café aqui é barato.','Because the coffee here is cheap.','Connosco não, convosco.','Not with us, with you.'),
X('Fala bem português. E inglês?','You speak Portuguese well. And English?','Sprachkenntnisse sind oft wichtig.','Falo inglês fluentemente e o português estou a melhorar.','I speak English fluently and I am improving my Portuguese.','Inglês é um país.','English is a country.','Falo bem com o meu gato.','I speak well with my cat.'),
X('Qual é o seu ponto fraco?','What is your weakness?','Ponto fraco heißt Schwäche. Eine klassische Frage.','Às vezes sou muito perfeccionista, mas estou a aprender a delegar.','Sometimes I am a perfectionist, but I am learning to delegate.','O meu ponto fraco é o pequeno-almoço.','My weakness is breakfast.','Não tenho pontos, tenho euros.','I do not have points, I have euros.'),
X('Está disponível para trabalhar por turnos?','Are you available to work shifts?','Disponível heißt verfügbar. Turnos heißt Schichten.','Sim, não há problema.','Yes, that is no problem.','Os turnos são para os gatos.','Shifts are for cats.','Disponível às terças de manhã, no verão.','Available on Tuesday mornings, in summer.'),
X('Tem alguma pergunta para nós?','Do you have any questions for us?','Stell am Ende eine Frage. Das zeigt Interesse.','Sim. Quando posso começar, se for escolhido?','Yes. When could I start, if I am chosen?','Sim, qual é a sua cor preferida?','Yes, what is your favourite colour?','Não, já sei tudo.','No, I already know everything.'),
X('Em princípio, no início do próximo mês. Damos notícias até sexta.','In principle, at the start of next month. We will let you know by Friday.','Dar notícias heißt Bescheid geben.','Muito obrigado pela oportunidade. Bom dia!','Thank you very much for the opportunity. Good day!','Sexta é muito longe.','Friday is very far away.','Notícias do futebol?','Football news?')]},
{id:'weekend',n:'Making weekend plans',who:'Tiago, a friend',l:2,g:'social daily',steps:[
X('Então, tens planos para o fim de semana?','So, do you have plans for the weekend?','Planos heißt Pläne. Fim de semana heißt Wochenende.','Ainda não. Tens alguma ideia?','Not yet. Do you have any idea?','Tenho planos para o meu almoço de ontem.','I have plans for yesterday\'s lunch.','O fim de semana está cansado.','The weekend is tired.'),
X('Podíamos ir à praia no sábado, se estiver sol.','We could go to the beach on Saturday, if it is sunny.','Podíamos heißt wir könnten. Se estiver sol heißt falls die Sonne scheint.','Boa! Qual praia?','Great! Which beach?','Sábado sou a praia.','On Saturday I am the beach.','Se estiver sol, durmo no frigorífico.','If it is sunny, I sleep in the fridge.'),
X('A Costa da Caparica. Vamos de autocarro ou de carro?','Costa da Caparica. Shall we go by bus or by car?','Die Costa da Caparica ist ein langer Strand südlich von Lissabon.','De carro é mais rápido. Eu conduzo!','By car is faster. I will drive!','De autocarro, porque sou um peixe.','By bus, because I am a fish.','Vamos de bacalhau.','Let us go by cod.'),
X('Combinado! A que horas passas por minha casa?','Deal! What time will you come by my place?','Passar por casa heißt vorbeikommen.','Às dez está bem? Assim evitamos o trânsito.','Is ten okay? That way we avoid the traffic.','Às dez da noite de ontem.','At ten last night.','Vou buscar o mar.','I am going to fetch the sea.'),
X('Perfeito. Levo a toalha e o guarda-sol.','Perfect. I will bring the towel and the parasol.','Toalha heißt Handtuch, guarda-sol Sonnenschirm.','Eu levo sandes e água.','I will bring sandwiches and water.','Eu levo a minha cama.','I will bring my bed.','O guarda-sol é meu primo.','The parasol is my cousin.'),
X('E no domingo? Há um concerto de fado em Alfama.','And on Sunday? There is a fado concert in Alfama.','Alfama ist das alte Viertel von Lissabon, berühmt für Fado.','Adorava ir! A que horas começa?','I would love to go! What time does it start?','Domingo é o meu dia de dormir no metro.','Sunday is my day to sleep on the metro.','Fado é uma fruta?','Is fado a fruit?'),
X('Às nove da noite. Jantamos antes numa tasca?','At nine in the evening. Shall we have dinner at a tasca before?','Tasca ist ein einfaches, typisches Lokal.','Sim, boa ideia! Reservo uma mesa.','Yes, good idea! I will book a table.','Não, jantamos depois de amanhã.','No, we will have dinner the day after tomorrow.','A tasca é muito alta.','The tasca is very tall.'),
X('Fixe! Vai ser um ótimo fim de semana.','Cool! It is going to be a great weekend.','Fixe heißt cool. Zum Abschied: Até sábado!','Vai mesmo! Até sábado!','It really is! See you on Saturday!','Fixe, até ontem!','Cool, see you yesterday!','Vai ser mau, mas ótimo.','It is going to be bad, but great.')]}

{id:'boardgame',n:'A board game with the kids',who:'Leonor, 7',l:1,g:'social',steps:[
X('Tio, tio! Queres jogar comigo?','Uncle, uncle! Do you want to play with me?','Kinder nennen Erwachsene in der Familie oft tio / tia (Onkel / Tante). Jogar heißt ein Spiel spielen.','Claro que sim! O que queres jogar?','Of course! What do you want to play?','Não, eu sou o teu dentista.','No, I am your dentist.','Claro, vamos ao banco.','Sure, let us go to the bank.'),
X('Este jogo! É o jogo da glória.','This game! It is the game of glory.','Jogo da glória ist ein klassisches portugiesisches Würfel-Brettspiel, ähnlich wie Leiterspiel.','Boa! Explicas-me as regras?','Great! Will you explain the rules to me?','Boa! É muito picante.','Great! It is very spicy.','O jogo está constipado.','The game has a cold.'),
X('Atiras o dado e andas as casas. Quem chegar primeiro ao fim ganha!','You roll the die and move the squares. Whoever reaches the end first wins!','Atirar o dado heißt würfeln. Andar as casas heißt die Felder vorrücken.','Percebi! Quem começa?','Got it! Who starts?','Percebi! Onde fica a farmácia?','Got it! Where is the pharmacy?','Atiro o dado pela janela.','I throw the die out of the window.'),
X('Eu! Sou a mais nova. Saiu um cinco!','Me! I am the youngest. I rolled a five!','Saiu um cinco heißt eine Fünf ist gefallen.','Muito bem! Avança cinco casas.','Well done! Move forward five squares.','Cinco euros, por favor.','Five euros, please.','Saiu o comboio.','The train left.'),
X('Um, dois, três, quatro, cinco! Agora é a tua vez, tio.','One, two, three, four, five! Now it is your turn, uncle.','É a tua vez heißt du bist dran.','Vou atirar... Saiu um dois.','I am rolling... I got a two.','A minha vez é amanhã.','My turn is tomorrow.','Saiu o meu gato.','My cat came out.'),
X('Ah, caíste na casa da ponte! Andas mais seis casas!','Ah, you landed on the bridge square! You move six more squares!','Cair na casa heißt auf dem Feld landen. Im Spiel gibt es besondere Felder.','A sério? Que sorte!','Really? How lucky!','A ponte está muito cansada.','The bridge is very tired.','Seis casas de banho.','Six bathrooms.'),
X('Não é justo! Agora tu vais à frente.','That is not fair! Now you are ahead.','Não é justo heißt das ist nicht fair. Ir à frente heißt vorne liegen.','Calma, ainda podes ganhar. É a tua vez!','Calm down, you can still win. It is your turn!','Sim, vou à frente para o trabalho.','Yes, I am going ahead to work.','Justo é o meu tio.','My uncle is fair.'),
X('Saiu um seis! Posso jogar outra vez?','I rolled a six! Can I go again?','Bei einer Sechs darf man oft noch einmal würfeln. Outra vez heißt noch einmal.','Podes! Com seis jogas outra vez.','You can! With a six you play again.','Não, seis é proibido.','No, six is forbidden.','Outra vez o bacalhau.','Cod again.'),
X('Oh não, caí na casa do poço. Tenho de esperar.','Oh no, I fell into the well square. I have to wait.','Poço heißt Brunnen. Auf diesem Feld muss man warten.','Não faz mal, é só uma vez.','Never mind, it is only once.','Vou buscar água ao poço.','I will fetch water from the well.','Espera na paragem do autocarro.','Wait at the bus stop.'),
X('Tio, tu estás a fazer batota?','Uncle, are you cheating?','Fazer batota heißt schummeln.','Não! Eu nunca faço batota. Conta comigo.','No! I never cheat. Count with me.','Sim, estou a fazer bacalhau.','Yes, I am making cod.','A batota é muito boa.','Cheating is very good.'),
X('Cheguei ao fim! Ganhei! Ganhei!','I reached the end! I won! I won!','Ganhar heißt gewinnen. Gratuliere ihr!','Parabéns, Leonor! Jogaste muito bem!','Congratulations, Leonor! You played very well!','Não vale, eu sou o chefe.','It does not count, I am the boss.','Ganhaste um empréstimo.','You won a loan.'),
X('Vamos jogar outra vez? Por favor!','Shall we play again? Please!','Kinder wollen immer noch einmal spielen. Du kannst ja sagen oder eine Pause vorschlagen.','Vamos! Mas depois é hora do lanche.','Let us! But afterwards it is snack time.','Não, agora vou trabalhar na bolsa.','No, now I am going to work at the stock exchange.','Outra vez amanhã de ontem.','Again tomorrow of yesterday.')]},
{id:'hideseek',n:'Hide and seek in the garden',who:'Tomás and Rita',l:1,g:'social',steps:[
X('Vamos jogar às escondidas! Tu contas!','Let us play hide and seek! You count!','Jogar às escondidas heißt Verstecken spielen. Contar heißt hier zählen.','Está bem! Conto até vinte. Escondam-se!','Okay! I will count to twenty. Hide!','Conto o dinheiro do banco.','I am counting the bank money.','Escondo o meu carro.','I am hiding my car.'),
X('Não vale espreitar! Fecha os olhos!','No peeking! Close your eyes!','Espreitar heißt spähen, linsen. Não vale heißt das gilt nicht.','Já fechei. Um, dois, três...','I have closed them. One, two, three...','Os olhos estão no frigorífico.','The eyes are in the fridge.','Não vale nada, sou rico.','It is worth nothing, I am rich.'),
X('Já está! Já nos escondemos!','Ready! We have hidden!','Já está heißt fertig. Wenn du losgehst, ruft man auf Portugiesisch: Lá vou eu! (Ich komme!)','Dezanove, vinte! Lá vou eu!','Nineteen, twenty! Here I come!','Vinte euros, obrigado!','Twenty euros, thanks!','Vou ao médico.','I am going to the doctor.'),
X('Hihi! Não me encontras!','Hehe! You will not find me!','Das Kichern kommt von hinter dem Baum. Atrás da árvore heißt hinter dem Baum.','Hum... Quem será que está atrás da árvore?','Hmm... Who could be behind the tree?','A árvore está a rir de mim.','The tree is laughing at me.','Atrás da árvore está o IVA.','The VAT is behind the tree.'),
X('Não estou aqui!','I am not here!','Ein Klassiker bei kleinen Kindern.','Encontrei-te, Tomás!','Found you, Tomás!','Está bem, não estás aqui. Adeus!','Okay, you are not here. Bye!','Aqui é o aeroporto.','This is the airport.'),
X('Ahh! Agora temos de procurar a Rita.','Ahh! Now we have to look for Rita.','Procurar heißt suchen.','Ajudas-me? Onde achas que ela está?','Will you help me? Where do you think she is?','Procurar a Rita no supermercado.','Look for Rita at the supermarket.','A Rita está em Paris de comboio.','Rita is in Paris by train.'),
X('Acho que está debaixo da mesa ou atrás do sofá.','I think she is under the table or behind the sofa.','Debaixo de heißt unter, atrás de heißt hinter.','Vamos ver debaixo da mesa primeiro.','Let us look under the table first.','A mesa está atrás do sofá a dormir.','The table is behind the sofa, sleeping.','Primeiro o sofá, depois o banco.','First the sofa, then the bank.'),
X('Não está! E atrás do sofá também não!','She is not there! And not behind the sofa either!','Também não heißt auch nicht.','Que esconderijo bom! Rita, onde estás?','What a good hiding place! Rita, where are you?','Então vamos jantar.','Then let us have dinner.','O sofá é muito caro.','The sofa is very expensive.'),
X('Estou dentro do armário! Ganhei!','I am inside the wardrobe! I won!','Dentro de heißt in, innerhalb. Armário heißt Schrank.','És mesmo boa a esconder-te! Ganhaste!','You are really good at hiding! You won!','O armário ganhou o jogo.','The wardrobe won the game.','Dentro do armário há impostos.','There are taxes inside the wardrobe.'),
X('Agora conta a Rita! Tu escondes-te connosco!','Now Rita counts! You hide with us!','Connosco heißt mit uns.','Boa ideia! Vamos para trás da garagem.','Good idea! Let us go behind the garage.','Eu escondo-me no meu escritório em Lisboa.','I will hide in my office in Lisbon.','Connosco não, com o banco.','Not with us, with the bank.'),
X('Shhh! Fala baixinho, senão ela ouve!','Shhh! Speak quietly, otherwise she hears!','Baixinho heißt ganz leise. Senão heißt sonst.','Está bem, vou falar baixinho.','Okay, I will speak very quietly.','Vou falar muito alto ao telefone.','I will talk very loudly on the phone.','Baixinho é o meu cão.','My dog is very small.'),
X('Encontrei-vos! Agora o tio conta outra vez!','Found you! Now uncle counts again!','Encontrei-vos heißt ich habe euch gefunden.','Está bem! Mas depois vamos lanchar.','Okay! But afterwards we will have a snack.','Não, agora vou fazer uma auditoria.','No, now I am going to do an audit.','Outra vez vinte euros.','Twenty euros again.')]},

function playHTML(t,slow,my){
 return new Promise((res,rej)=>{
  const a=player();if(!a||AU.htmlBad){rej('skip');return;}
  let done=false,to=0;
  const fin=(ok,why)=>{if(done)return;done=true;clearTimeout(to);a.onplaying=null;a.onerror=null;if(ok)res();else rej(why);};
  try{
   a.pause();a.muted=false;a.volume=1;
   const u=AU.urls[t];if(!u){clipURLA(t).then(()=>{},()=>{});fin(false,'loading');return;}a.src=u;
   try{a.preservesPitch=true;a.webkitPreservesPitch=true;}catch(e){}
   a.playbackRate=slow?.75:(S.rate||1);
   a.onplaying=()=>fin(true);a.onended=()=>endNow(my);
   a.onerror=()=>fin(false,'media error '+((a.error&&a.error.code)||''));
   /* the clip itself starts with ~150 ms of silence; any extra wait from the setting is added before play().

   const extra=AU.elPlayed?Math.max(0,leadMs()-150):0;
   to=setTimeout(()=>fin(false,'timeout'),1800+extra);
   const go=()=>{if(my!==AU.seq){fin(false,'skip');return;}const p=a.play();AU.elPlayed=true;if(p&&p.catch)p.catch(e=>fin(false,(e&&e.name)||'play rejected'));};

 if(!AU.pend)AU.pend={};if(AU.pend[t])return AU.pend[t];
 const pr=clipBytes(t).then(b=>decode(c,b)).then(b=>{AU.bufs[t]=b;delete AU.pend[t];const ks=Object.keys(AU.bufs);if(ks.length>BUFMAX)delete AU.bufs[ks[0]];return b;},e=>{delete AU.pend[t];throw e;});

async function playWA(t,slow,my){
 const c=actx();if(!c)throw 'no Web Audio';
 if(c.state!=='running'){await Promise.race([c.resume(),new Promise(r=>setTimeout(r,600))]);if(c.state!=='running')throw 'Web Audio locked (tap once)';}
 const buf=await getBuf(t);
 if(my!==AU.seq)return;
 try{if(AU.el)AU.el.pause();}catch(e){}
 const s=c.createBufferSource();s.buffer=buf;s.playbackRate.value=slow?.85:(S.rate||1);s.connect(c.destination);
 /* clips carry ~150 ms of lead-in silence for the audio element; with the output already open we skip most of it */
 /* wait a moment before the voice starts (setting "Pause before audio"), so the first sound is never clipped */
 s.start(c.currentTime+leadMs()/1000,Math.min(.09,buf.duration/4));AU.src=s;s.onended=()=>endNow(my);
}
function playClip(t,slow){
 const my=AU.seq;
 const okWA=()=>{if(my!==AU.seq)return;AU.lastEv='recorded voice ok';AU.path='Web Audio';AU.lastErr='';};
 const okEL=()=>{if(my!==AU.seq)return;AU.lastEv='recorded voice ok';AU.path='audio element';AU.lastErr='';};
 const toDevice=e=>{if(my!==AU.seq)return;AU.lastErr=(AU.lastErr?AU.lastErr+' · ':'')+((e&&e.name)||e);sayDevice(t,slow,true);};
 const viaEl=()=>playHTML(t,slow,my).then(okEL).catch(why=>{if(my!==AU.seq)return;if(why!=='skip'&&/NotSupported|media error|SecurityError/.test(String(why)))AU.htmlBad=true;if(why!=='skip')AU.lastErr='audio element: '+why;return Promise.reject(why);});
 /* slow playback keeps the pitch only in the audio element, so slow prefers it */
 if(waReady()&&!slow){playWA(t,slow,my).then(okWA).catch(e=>{if(my!==AU.seq)return;AU.lastErr='Web Audio: '+((e&&e.name)||e);viaEl().catch(toDevice);});return;}
 viaEl().catch(()=>{if(my!==AU.seq)return;playWA(t,slow,my).then(okWA).catch(toDevice);});
}
async function getTts(){if(AU.tts!==undefined)return AU.tts;try{AU.tts=(window.claude&&window.claude.use)?await window.claude.use('tts'):null;}catch(e){AU.tts=null;}return AU.tts;}
async function sayClaude(t,slow){
 const my=AU.seq;
 /* after a rate limit, use the device voice for a minute instead of waiting for nothing */
 if(Date.now()<(AU.ttsCool||0)){sayDevice(t,slow,false);return;}
 const T=await getTts();if(my!==AU.seq)return;
 if(!T){AU.lastEv='no Claude voice here';sayDevice(t,slow,false);return;}
 /* some views do not accept every language tag: try pt-PT, then pt-BR, then none; then the device voice */
 const tries=COURSE()==='de'?[{language:'de-DE'},{language:'de'},{}]:[{language:'pt-PT'},{language:'pt-BR'},{}];
 /* the Claude voice gets the same short pause first, so its first sound is not cut off */
 const L=leadMs();if(L){await new Promise(r=>setTimeout(r,L));if(my!==AU.seq)return;}
 for(const o of tries){
  try{await T.speak(t,Object.assign({rate:slow?.75:1},o));if(my===AU.seq){AU.lastEv='Claude voice ok';AU.path='Claude voice'+(o.language?' ('+o.language+')':'');AU.lastErr='';}endNow(my);return;}
  catch(e){const c=e&&e.code;AU.lastErr='Claude voice: '+(c||'error');if(my!==AU.seq||c==='viewer_stopped')return;if(c==='rate_limited')AU.ttsCool=Date.now()+60000;if(c==='not_granted'||c==='rate_limited'||c==='busy')break;}

/* Online voice (Google's translation voice with the Portugal accent) for texts without a recording.
   Your text is sent to Google for this. Long texts are split into parts of up to 180 characters. */
function webChunks(t){const out=[];let cur='';t.split(/(?<=[.!?;,])\s+|\s+/).forEach(w=>{if((cur+' '+w).trim().length>180){if(cur)out.push(cur);cur=w;}else cur=(cur+' '+w).trim();});if(cur)out.push(cur);return out;}
function playWeb(t,slow,my){
 return new Promise((res,rej)=>{
  const a=player();if(!a||navigator.onLine===false){rej('offline');return;}
  const parts=webChunks(t);let k=0,started=false;
  const next=()=>{if(my!==AU.seq)return;if(k>=parts.length){endNow(my);return;}
   a.onended=next;a.onerror=()=>{if(!started)rej('web voice error');else next();};
   a.onplaying=()=>{if(!started){started=true;res();}};
   a.src=(COURSE()==='de'?'https://translate.google.de/translate_tts?ie=UTF-8&client=tw-ob&tl=de&ttsspeed=':'https://translate.google.pt/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&ttsspeed=')+(slow?'0.5':'1')+'&q='+encodeURIComponent(parts[k++]);
   try{a.playbackRate=1;a.muted=false;}catch(e){}
   const p=a.play();if(p&&p.catch)p.catch(e=>{if(!started)rej((e&&e.name)||'blocked');});};
  setTimeout(()=>{if(!started)rej('web voice timeout');},4000);
  const L=leadMs();if(L&&AU.elPlayed)setTimeout(next,L);else{AU.elPlayed=true;next();}
 });
}
const ptPTvoice=()=>VO.find(v=>new RegExp(TLANG().replace('-','[-_]'),'i').test(v.lang));
function sayDevice(t,slow,explicit){
 if(!canSpeak()){if(explicit)sayClaude(t,slow);else AU.lastEv='no voice for this word';return;}
 const sy=window.speechSynthesis,my=AU.seq;let started=false,fell=false;
 const fall=why=>{if(fell||started||my!==AU.seq)return;fell=true;AU.lastEv=why;try{sy.cancel();}catch(e){}if(explicit)sayClaude(t,slow);};
 try{const u=new SpeechSynthesisUtterance(t);const v=voice();u.lang=v?v.lang:TLANG();if(v)u.voice=v;u.rate=clamp((S.rate||1)*(slow?.7:1),.5,2);
  u.onend=()=>endNow(my);u.onstart=()=>{started=true;AU.lastEv='device voice playing';AU.path='device voice';};u.onerror=ev=>{const er=(ev&&ev.error)||'error';if(er==='canceled'||er==='interrupted')return;AU.lastErr=er;fall('device voice error');};
  /* Chrome can leave speech paused or stuck after a while: cancel, speak, then resume */
  const go=()=>{if(my!==AU.seq)return;try{if(sy.speaking||sy.pending)sy.cancel();}catch(e){}sy.speak(u);try{sy.resume();}catch(e){}setTimeout(()=>{try{if(sy.paused)sy.resume();}catch(e){}},120);};
  const L=leadMs();if(L)setTimeout(go,L);else go();setTimeout(()=>fall('device voice stayed silent'),2500+L);}catch(e){AU.lastErr=String(e);fall('device voice error');}
}
/* Recorded clips first. Own words have no recording: device voice, then Claude voice. */
function say(t,slow,explicit){if(!t)return;t=String(t);stopAudio();pulseSpk();if(hasClip(t)){playClip(t,slow);return;}if(t.startsWith('§D|'))t=t.slice(3);sayOther(t,slow,explicit!==false);}
/* no recording (your own words, new content): Portugal device voice -> online voice -> any device voice -> Claude voice */
function sayOther(t,slow,explicit){
 const my=AU.seq,mode=S.tts||'auto';
 const claudeOr=fb=>getTts().then(T=>{if(my!==AU.seq)return;if(T)sayClaude(t,slow);else fb();});
 const viaWeb=()=>playWeb(t,slow,my).then(()=>{if(my!==AU.seq)return;AU.lastEv='online voice ok';AU.path='online voice';AU.lastErr='';}).catch(e=>{if(my!==AU.seq)return;AU.lastErr='online voice: '+e;if(VO.length)sayDevice(t,slow,explicit);else claudeOr(()=>sayDevice(t,slow,explicit));});
 if(mode==='device'){sayDevice(t,slow,explicit);return;}
 if(mode!=='web'&&ptPTvoice()){sayDevice(t,slow,explicit);return;}
 /* inside claude.ai the online voice is blocked, so the Claude voice comes first there */
 if(window.claude&&window.claude.use&&mode!=='web'){claudeOr(viaWeb);return;}

/* ---------- game juice: sound effects, haptics, confetti, floating XP ---------- */
function tone(c,f,t0,d,type,vol,f2){const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.18,t0+.012);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.03);}
function sfx(k){
 if(S.sfx===false)return;const c=AU.ctx;if(!c||c.state!=='running')return;const t=c.currentTime+.01;
 try{
  if(k==='ok'){tone(c,660,t,.12,'triangle',.2);tone(c,990,t+.09,.2,'triangle',.2);}
  else if(k==='bad'){tone(c,220,t,.22,'sawtooth',.08,140);}
  else if(k==='coin'){tone(c,988,t,.07,'square',.06);tone(c,1319,t+.06,.14,'square',.06);}
  else if(k==='jump'){tone(c,320,t,.16,'triangle',.12,640);}
  else if(k==='hit'){tone(c,160,t,.25,'square',.08,80);}
  else if(k==='tap'){tone(c,520,t,.05,'sine',.08);}
  else if(k==='combo'){[660,880,1100].forEach((f,i)=>tone(c,f,t+i*.06,.12,'triangle',.14));}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(c,f,t+i*.11,.22,'triangle',.18));}
  else if(k==='lose'){[392,330,262].forEach((f,i)=>tone(c,f,t+i*.14,.25,'triangle',.14));}
 }catch(e){}
}
function buzz(p){if(S.sfx===false)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function confetti(){
 if(RM())return;const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
 const W=cv.width=innerWidth,H=cv.height=innerHeight,c=cv.getContext('2d');
 const cols=['#F2B632','#1F4FA3','#22B573','#FF6B5A','#7B5CFF','#2EA8FF'];
 const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
 let f=0;const step=()=>{c.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore();});
  if(++f<150)requestAnimationFrame(step);else cv.remove();};requestAnimationFrame(step);
}
function floatXP(n,el){

 let x=innerWidth/2,y=innerHeight/2;if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top;}
 f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
}

/* ---------- curriculum ---------- */
function path(){const st=LV().s;const ts=TOPICS.filter(t=>t.words&&t.words.length&&t.g.some(g=>S.goals.includes(g)));const hi=ts.filter(t=>t.l>=st).sort((a,b)=>a.l-b.l||TOPICS.indexOf(a)-TOPICS.indexOf(b));return hi.concat(ts.filter(t=>t.l<st));}
function prog(t){const ws=t.words||[];let seen=0,mas=0;ws.forEach(w=>{const c=S.cards[w.id];if(c&&c.seen>0){seen++;if(c.b>=4)mas++;}});return{n:ws.length,seen,mas,pct:ws.length?seen/ws.length:0};}
function isOpen(i,p){if(i===0)return true;if(S.unlocked.includes(p[i].id))return true;return isOpen(i-1,p)&&prog(p[i-1]).pct>=0.6;}
function newIds(){const out=[];S.custom.forEach(c=>{const x=S.cards[c.id];if((!x||!x.seen)&&out.length<S.per)out.push(c.id);});return out;}
function dueIds(){const t=today();return Object.keys(S.cards).filter(id=>WORDS[id]&&S.cards[id].seen>0&&S.cards[id].due<=t);}
function pool(){let ids=Object.keys(S.cards).filter(id=>WORDS[id]&&S.cards[id].seen>0);if(ids.length<24){const extra=[];path().forEach(t=>t.words.forEach(w=>{if(!ids.includes(w.id))extra.push(w.id);}));ids=ids.concat(extra.slice(0,24-ids.length));}return ids.map(id=>WORDS[id]);}

const GAMES3=['match','build','listen','memory','balloon','swipe'];
const DLG_AT={kids:['boardgame'],games:['hideseek'],finance:['finmeet'],ai:['aiproject'],food:['cafe','rest'],intro:['meet','neighbour'],move:['dir','taxi'],health:['pharm'],doctor:['doctor'],work1:['work1'],work2:['work2','phonecall'],family2:['family'],fruitveg:['market'],travel:['train','hotel'],clothes:['clothesshop'],social:['party','weekend'],jobs:['interview'],chores:['flat']};

const sumBtns=(node,again)=>node?'<button class="btn" data-act="jnext">Next step</button><button class="btn ghost" data-act="jback">Back to journey</button>':again;
function journey(){
 const out=[];let gi=0;
 path().forEach((t,u)=>{
  const ws=t.words,k=Math.max(1,Math.ceil(ws.length/8)),sz=Math.ceil(ws.length/k),nodes=[];
  for(let c=0;c<k;c++){
   const ch=ws.slice(c*sz,(c+1)*sz);if(!ch.length)continue;
   nodes.push({id:t.id+':l'+c,type:'learn',title:'Learn '+ch.length+' new words',sub:ch.slice(0,3).map(w=>w.pt).join(' · ')+' ...',words:ch.map(w=>w.id)});
   const gm=GAMES3[(u+c)%GAMES3.length];
   nodes.push({id:t.id+':g'+c,type:'game',game:gm,title:GNAME[gm],sub:'Practise these words',words:ch.map(w=>w.id)});
  }
  (COURSE()==='de'?[]:DLG_AT[t.id]||[]).forEach(did=>{const d=DLG(did);if(d)nodes.push({id:t.id+':t'+did,type:'talk',dlg:did,title:'Talk: '+d.n,sub:'Conversation with '+d.who});});
  nodes.push({id:t.id+':c',type:'check',title:'Unit check',sub:'A short quiz on this unit',words:ws.map(w=>w.id)});
  if(u%3===2)nodes.push({id:t.id+':q',type:'game',game:'quest',title:'Vocabulary Quest',sub:'Milestone level: run, jump, answer',words:[]});
  nodes.forEach(n=>{n.unit=t.id;n.i=gi++;});
  out.push({t,nodes,u});
 });
 return out;
}
const flat=()=>journey().reduce((a,u)=>a.concat(u.nodes),[]);

function distract(w,key,n){
 const cand=Object.values(WORDS).filter(x=>x.id!==w.id&&x[key]!==w[key]);
 const sc=x=>(x.topic===w.topic?0:2)+Math.abs(x[key].length-w[key].length)/4+(key==='pt'&&x.pt[0]===w.pt[0]?0:1)+Math.random()*1.5;
 cand.sort((a,b)=>sc(a)-sc(b));const out=[],seen=new Set([w[key]]);
 for(const x of cand){if(!seen.has(x[key])){seen.add(x[key]);out.push(x);if(out.length>=n)break;}}
 return out;
}
function mkQ(w,type){
 if(type==='type')return{type,w,o:[]};
 const key=(type==='pt2en'||type==='listen2en')?'en':'pt';
 const o=shuf([{t:w[key],ok:true}].concat(distract(w,key,3).map(x=>({t:x[key],ok:false}))));
 return{type,w,o};
}

function bCheck(){const g=ui.g,w=g.ws[g.i];if(g.slots.some(x=>x==null))return;const guess=g.slots.map(id=>bCh(g,id)).join('');
 if(guess===w.pt.normalize('NFC')){g.st='right';g.sc++;if(!g.h&&!g.miss)g.combo++;else g.combo=0;const x=g.h?5:10;g.xp+=x;addXP(x);cheer(x);ui.pend=w.pt;}

function bHint(){const g=ui.g,w=g.ws[g.i];const ch=Array.from(w.pt.normalize('NFC'));let k=0;while(k<ch.length&&g.slots[k]!=null&&bCh(g,g.slots[k])===ch[k])k++;if(k>=ch.length)return;g.slots=g.slots.map((s,i)=>i<k?s:null);const u=new Set(g.slots.filter(x=>x!=null));const t=g.tiles.find(t=>!u.has(t.id)&&t.c===ch[k]);if(t)g.slots[k]=t.id;g.h=1;g.hints++;g.st='play';bCheck();}

/* ---------- Word Match ---------- */
function gsrc(o,min,f){
 let base=(o&&o.words&&o.words.length)?o.words.slice():[];if(f)base=base.filter(f);
 if(base.length<min){const ids=new Set(base.map(w=>w.id));const ex=shuf(pool().filter(w=>(!f||f(w))&&!ids.has(w.id)));while(base.length<min&&ex.length)base.push(ex.shift());}
 if(base.length<min){toast('Learn a few more words first');return null;}
 return base;
}

 ui.g={k:'match',timed,t:60,sc:0,miss:0,rounds:0,tr:o?1:3,src,node:o?o.node:null,stars:0,st:'play',xp:0,flash:null,selL:null,selR:null,combo:0,best:0,just:null};mNew();window.scrollTo(0,0);render();
 if(timed){ui.g.iv=setInterval(()=>{const g=ui.g;if(!g||g.k!=='match'||g.st!=='play'){return;}g.t--;const e=$('#tmr');if(e)e.textContent=g.t+'s';const b=$('#tbar');if(b){b.firstChild.style.width=(g.t/60*100)+'%';b.classList.toggle('low',g.t<=10);}if(g.t<=10&&g.t>0)sfx('tap');if(g.t<=0)mEnd();},1000);}
}

 const tile=(w,side,i)=>{const done=g.done.includes(w.id),sel=(side==='l'?g.selL:g.selR)===i,fl=g.flash&&g.flash[side==='l'?0:1]===i;

function qJump(){const g=ui.g;if(!g||g.k!=='quest'||g.st!=='run'||!g.on)return;g.vy=-580;g.on=false;g.sq=1;sfx('jump');}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function qLoop(ts){
 const g=ui.g;if(!g||g.k!=='quest')return;
 const dt=Math.min(.05,(ts-(g.last||ts))/1000);g.last=ts;g.t+=dt;
 if(g.st==='run')qStep(dt);
 g.parts=g.parts.filter(p=>(p.life-=dt)>0);g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;});
 g.sq=Math.max(0,g.sq-dt*4);

function burst(g,x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*160;g.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:.5+Math.random()*.3,c:col});}}
function qStep(dt){
 const g=ui.g;g.cam+=g.sp*dt;
 const was=g.on;
 g.vy+=1500*dt;g.py+=g.vy*dt;if(g.py>=GY-PH){g.py=GY-PH;g.vy=0;g.on=true;if(!was)g.sq=.6;}else g.on=false;
 g.inv=Math.max(0,g.inv-dt);

 if(W.deco==='peaks'&&layer==='back'){c.fillStyle='#141E44';for(let i=0;i<5;i++){const x=wrap(i*220,.12,1100);c.beginPath();c.moveTo(x-40,GY-30);c.lineTo(x+70,GY-150-(i%2)*30);c.lineTo(x+180,GY-30);c.fill();}c.fillStyle='rgba(255,120,60,.8)';const vx=wrap(380,.12,1100)+70;c.beginPath();c.arc(vx,GY-150,6+Math.sin(g.t*5)*2,0,7);c.fill();}

 const g=ui.g,c=g.cx,k=g.col,cam=g.cam,W=g.w,D=!!W.night;

 sky.addColorStop(0,W.sky[0]);sky.addColorStop(1,W.sky[1]);

 /* clouds */

 for(let i=0;i<5;i++){const x=((i*190-cam*.15)%(QW+200)+QW+200)%(QW+200)-100,y=50+(i*37)%70;c.beginPath();c.arc(x,y,18,0,7);c.arc(x+20,y-8,22,0,7);c.arc(x+42,y,17,0,7);c.fill();}
 /* hills (two parallax layers) */
 const hill=(sp,base,amp,col,per)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,GY);for(let x=0;x<=QW;x+=8){const wx=x+cam*sp;c.lineTo(x,base-amp*(Math.sin(wx/per)*.6+Math.sin(wx/(per*.43))*.4));}c.lineTo(QW,GY);c.closePath();c.fill();};
 qDeco(c,g,W,'back');hill(.2,GY-40,30,W.hills[0],90);qDeco(c,g,W,'mid');hill(.45,GY-14,20,W.hills[1],60);qDeco(c,g,W,'front');
 if(g.dark&&!W.night){c.fillStyle='rgba(8,12,40,.32)';c.fillRect(0,0,QW,GY);}
 /* ground: azulejo tiles */
 c.fillStyle=W.ground;c.fillRect(0,GY,QW,QH-GY);
 c.fillStyle=W.top;c.fillRect(0,GY,QW,8);
 if(!qGround(c,g,W))for(let i=-1;i<18;i++){const x=i*40-(cam%40);c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.strokeRect(x+2,GY+12,36,36);c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.moveTo(x+20,GY+18);c.lineTo(x+26,GY+30);c.lineTo(x+20,GY+42);c.lineTo(x+14,GY+30);c.closePath();c.fill();}
 /* coins (spinning) */
 g.coinsL.forEach(o=>{if(o.got)return;const x=o.x-cam;if(x<-20||x>QW+20)return;const sx=Math.abs(Math.cos(g.t*4+o.x*.01));const y=o.y+Math.sin(g.t*3+o.x)*2;
  c.fillStyle='#E0A100';c.beginPath();c.ellipse(x,y,9*sx+1,9,0,0,7);c.fill();c.fillStyle='#FFD34D';c.beginPath();c.ellipse(x,y,7*sx+.5,7,0,0,7);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x-1.5*sx,y-4,3*sx,8);});
 /* obstacles (crates, or the world's own shape) */
 g.obs.forEach(o=>{if(o.hit)return;const x=o.x-cam;if(x<-60||x>QW+20)return;const y=GY-o.h;if(qObsDraw(c,g,o,x,y))return;c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(x+o.w/2,GY+2,o.w/2+2,4,0,0,7);c.fill();
  c.fillStyle='#C98A45';rr(c,x,y,o.w,o.h,4);c.fill();c.strokeStyle='#8A5A26';c.lineWidth=3;rr(c,x+1.5,y+1.5,o.w-3,o.h-3,3);c.stroke();c.beginPath();c.moveTo(x+4,y+4);c.lineTo(x+o.w-4,y+o.h-4);c.moveTo(x+o.w-4,y+4);c.lineTo(x+4,y+o.h-4);c.stroke();});
 qDrawGulls(c,g);
 /* gates: azulejo arch */
 g.gates.forEach((o,i)=>{const x=o.x-cam;if(x<-80||x>QW+40)return;c.globalAlpha=o.open?.3:1;
  c.fillStyle='#1F4FA3';rr(c,x-6,60,34,GY-60,[17,17,0,0]);c.fill();c.fillStyle='#fff';for(let y=80;y<GY-16;y+=30){c.beginPath();c.moveTo(x+11,y);c.lineTo(x+18,y+10);c.lineTo(x+11,y+20);c.lineTo(x+4,y+10);c.closePath();c.fill();}
  c.fillStyle=k.sun;c.beginPath();c.arc(x+11,58,14,0,7);c.fill();c.fillStyle='#2B2000';c.font='800 15px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(o.open?'✓':'?',x+11,59);c.textAlign='left';c.globalAlpha=1;});
 /* finish flag */
 const fx=g.finish-cam;if(fx<QW+60){c.fillStyle='#ddd';c.fillRect(fx,GY-110,5,110);const wv=Math.sin(g.t*6)*3;c.fillStyle='#E54B3C';c.beginPath();c.moveTo(fx+5,GY-110);c.quadraticCurveTo(fx+25,GY-110+wv,fx+46,GY-104);c.lineTo(fx+46,GY-80);c.quadraticCurveTo(fx+25,GY-86+wv,fx+5,GY-84);c.fill();c.fillStyle='#1FA66A';c.fillRect(fx+5,GY-110,14,26);}
 /* player: round hero with eyes, squash & stretch */

 c.fillStyle='rgba(0,0,0,.2)';c.beginPath();c.ellipse(cx,GY+3,PW/2*(1-(GY-by)/200),5,0,0,7);c.fill();

  c.fillStyle='#E54B3C';c.beginPath();c.arc(cx-sw/2+3,by-sh+8,6,0,7);c.fill();
  if(!air){const st=Math.sin(g.t*18)*3;c.fillStyle='#14213D';c.fillRect(cx-10+st,by-2,7,4);c.fillRect(cx+4-st,by-2,7,4);}
 }
 /* particles */
 g.parts.forEach(p=>{c.globalAlpha=Math.min(1,p.life*2);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,3.5,0,7);c.fill();});c.globalAlpha=1;
 /* HUD in canvas */
 c.fillStyle='rgba(20,33,61,.55)';rr(c,12,12,112,32,16);c.fill();
 c.fillStyle='#FFD34D';c.beginPath();c.arc(30,28,9,0,7);c.fill();c.fillStyle='#fff';c.font='800 17px sans-serif';c.textBaseline='middle';c.fillText(String(g.coins),46,29);
 for(let i=0;i<3;i++){const x=QW-30-i*30,y=28;c.fillStyle=i<g.hearts?'#EE5D4A':'rgba(20,33,61,.3)';c.beginPath();c.moveTo(x,y+9);c.bezierCurveTo(x-14,y,x-9,y-11,x,y-4);c.bezierCurveTo(x+9,y-11,x+14,y,x,y+9);c.fill();}
 c.fillStyle='rgba(20,33,61,.3)';rr(c,140,24,QW-260,9,5);c.fill();c.fillStyle='#4CC46F';rr(c,140,24,Math.max(9,(QW-260)*Math.min(1,cam/g.finish)),9,5);c.fill();
 g.gates.forEach(o=>{const gx=140+(QW-260)*(o.x/g.finish);c.fillStyle=o.open?'#4CC46F':'#F2B632';c.beginPath();c.arc(gx,28,5,0,7);c.fill();});

function sentPool(){

 return out;
}

/* ---------- cloud save: your Claude account is your login ----------
   When the app is opened through its claude.ai link, the progress of the player "pcloud" is stored in the
   private per-person area of the artifact's database (data/users/<your id>/save). Nobody else can read it,
   and it stays when the app gets an update (a new version published to the same link).
   Opened as a local file, the app keeps working with browser storage only. */
const CL={st:(window.claude&&window.claude.use)?'connecting':'off',db:null,ref:null,uid:null,timer:0,busy:false,dirty:false,last:0,err:'',dev:Math.random().toString(36).slice(2,10),unsub:null,name:''};
const CLOUD_ID='pcloud';
const inCloud=()=>CL.st!=='off'&&CL.st!=='connecting'&&PL.cur===CLOUD_ID&&!!CL.ref;
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);}
async function cloudInit(){
 if(CL.st==='off')return;
 let db=null,user=null;
 try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);}catch(e){}
 let uid=null;try{uid=user?await user.id():null;}catch(e){}
 if(!db||!uid){CL.st='off';render();return;}
 /* people you share the link with (outside your account) may use the app, but cannot write to its database */
 let canW=null;try{canW=user.can?await user.can('data.write'):null;}catch(e){}
 if(canW===false){CL.st='off';CL.guest=true;render();return;}
 try{CL.name=(await user.name())||'';}catch(e){}
 CL.db=db;CL.uid=uid;CL.ref=db.doc('data/users/'+uid+'/save');
 let p=PL.list.find(x=>x.id===CLOUD_ID);
 if(!p){p={id:CLOUD_ID,name:CL.name||'Me',av:'🦊',pin:'',cloud:true};PL.list.unshift(p);plSave();}
 let remote=null;
 try{const snap=await withTimeout(CL.ref.get(),10000);remote=snap.exists?snap.data():null;}
 catch(e){if(e&&e.code==='invalid_argument'){CL.st='off';CL.guest=true;render();return;}CL.st='error';CL.err=e&&e.code==='timeout'?'Your account cannot be reached right now. Progress is kept in this browser and saved later.':'Cloud save is not available ('+((e&&e.code)||'error')+').';}
 let local=null;try{local=JSON.parse(localStorage.getItem(skey(CLOUD_ID))||'null');}catch(e){}
 if(remote&&remote.json){
  if(!local||(remote.savedAt||0)>=(local.savedAt||0)){try{localStorage.setItem(skey(CLOUD_ID),remote.json);}catch(e){}}
  if(remote.player){p.name=remote.player.name||p.name;p.av=remote.player.av||p.av;plSave();}
 }
 if(CL.st!=='error')CL.st='ok';
 /* open straight into the account player, unless someone else is logged in on this device */
 if(!PL.cur||PL.cur===CLOUD_ID){PL.cur=CLOUD_ID;plSave();load();resetUi();render();}
 if(inCloud()&&(!remote||(S.savedAt||0)>(remote.savedAt||0))&&S.setup)cloudQueue(800);
 cloudWatch();
}
/* live: progress made on another device shows up here too */
function cloudWatch(){
 if(!CL.ref||CL.unsub)return;

/* ---------- courses: European Portuguese (for English/German speakers) or German (for Portuguese speakers) ----------
   The German course reuses every word: the German meaning becomes the word to learn, the Portuguese word its meaning.
   Each player has one course; to learn the other language, create another player. */
var BUILT=null;
function COURSE(){try{return S&&S.course==='de'?'de':'pt';}catch(e){return 'pt';}}
const deClean=s=>String(s).split(' / ')[0].replace(/\s*\([^)]*\)/g,'').trim();
function buildWords(course){
 course=course||COURSE();if(BUILT===course)return;BUILT=course;
 Object.keys(WORDS).forEach(k=>delete WORDS[k]);
 const seen=new Set();
 TOPICS.forEach(t=>{const out=[];if(t.only&&t.only!==course){t.words=out;return;}t.w.forEach((s,i)=>{const p=s.split('|');let o;
  if(course==='de'){if(!p[2])return;const tg=deClean(p[2]);if(!tg||seen.has(tg.toLowerCase()))return;seen.add(tg.toLowerCase());o=t.only==='de'?{id:t.id+'.'+i,pt:tg,en:p[0],de:p[1],ex:p[3]||'',exEn:p[4]||'',note:p[5]||'',topic:t.id}:{id:t.id+'.'+i,pt:tg,en:p[0],de:p[1],ex:'',exEn:'',note:tg!==p[2]?'Também: '+p[2]:'',topic:t.id};}
  else o={id:t.id+'.'+i,pt:p[0],en:p[1],de:p[2]||'',ex:p[3]||'',exEn:p[4]||'',note:p[5]||'',topic:t.id};
  WORDS[o.id]=o;out.push(o);});t.words=out;});
 try{loadVoices();}catch(e){}
}
